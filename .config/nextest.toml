[profile.default]
# Origin parity flows include source fetch + compile + deploy and can exceed 60s.
slow-timeout = { period = "120s", terminate-after = 4 }

[test-groups]
trybuild-ui = { max-threads = 1 }

[[profile.default.overrides]]
# Trybuild suites spawn nested Cargo builds under the broad gates'
# worktree-owned target/verification directory. Keep them serialized so CI
# runners do not spend the test timeout waiting on Cargo's build lock while
# unrelated tests continue to run in parallel.
filter = '''
binary(=capability_ui)
| binary(=derive_ui)
| binary(=signing_ui)
| binary(=application_privacy_ui)
'''
test-group = "trybuild-ui"
