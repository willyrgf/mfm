name: CI
permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches: [dev]
  pull_request:

env:
  NIX_CMD_OPTS: "-L -v --log-format bar-with-logs"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Nix flake check
        run: |
          nix flake check

      - name: Nixfied CI (basic)
        run: |
          nix run .#ci $NIX_CMD_OPTS -- --basic --summary

      - name: Smoke mfm_cli --help
        run: |
          nix run .#mfm_cli $NIX_CMD_OPTS -- --help

  parity-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Nixfied CI (parity)
        run: |
          nix run .#ci $NIX_CMD_OPTS -- --parity --summary

  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Nixfied CI (audit)
        run: |
          nix run .#ci $NIX_CMD_OPTS -- --audit --summary
