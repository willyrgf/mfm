name: CI
permissions:
  contents: read
  pull-requests: write

on:
  push:

jobs:
  flake-check:
    name: Flake Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Nix cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/nix
          key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'flake.nix', 'nixfied.nix', 'Cargo.lock', '.github/workflows/checks.yml') }}

      - name: Nix flake check
        run: |
          nix -L -v --log-format bar-with-logs flake check

  ci-full:
    name: Nixfied CI (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    env:
      LOG_TEE: "1"
      LOG_LEVEL: "debug"
      OUTPUT_MODE: "both"
      MFM_ENV: "test"
      RUST_BACKTRACE: "full"
      RUST_LOG: "debug"
      MFM_LOG: "debug"
      MFM_TEST_LOG: "1"
      MFM_TEST_LOG_FILTER: "debug"
    strategy:
      fail-fast: true
      matrix:
        runner:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Nix cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/nix
          key: nix-${{ runner.os }}-${{ runner.arch }}-${{ github.ref_name }}-${{ hashFiles('flake.lock', 'flake.nix', 'nixfied.nix', 'Cargo.lock', '.github/workflows/checks.yml') }}

      - name: Nixfied CI
        env:
          NIXFIED_STATE_DIR: ${{ runner.temp }}/nixfied-state
        run: |
          nix -L -v --log-format bar-with-logs run .#ci

      - name: Upload CI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nixfied-state-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/nixfied-state
          if-no-files-found: ignore
