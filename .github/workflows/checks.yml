name: CI
permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches: [dev]
  pull_request:

env:
  NIX_CMD_OPTS: "-L -v --log-format bar-with-logs"

jobs:
  flake-check:
    name: Flake Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Nix cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/nix
          key: nix-${{ runner.os }}-${{ runner.arch }}-${{ github.ref_name }}-${{ hashFiles('flake.lock', 'flake.nix', 'Cargo.lock', '.github/workflows/checks.yml', 'nixfied/**/*.nix') }}

      - name: Nix flake check
        run: |
          nix flake check

  ci-full:
    name: Nixfied CI (full, ${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    env:
      LOG_TEE: "1"
      LOG_LEVEL: "debug"
      OUTPUT_MODE: "both"
      MFM_ENV: "test"
      RUST_BACKTRACE: "full"
      RUST_LOG: "debug"
      MFM_LOG: "debug"
      MFM_TEST_LOG: "1"
      MFM_TEST_LOG_FILTER: "debug"
    strategy:
      fail-fast: true
      matrix:
        runner:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Nix cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/nix
          key: nix-${{ runner.os }}-${{ runner.arch }}-${{ github.ref_name }}-${{ hashFiles('flake.lock', 'flake.nix', 'Cargo.lock', '.github/workflows/checks.yml', 'nixfied/**/*.nix') }}

      - name: Nixfied CI (full) (skip helios)
        env:
          CI_ARTIFACTS_ROOT: ${{ runner.temp }}/mfm-ci-artifacts
        run: |
          SKIP_HELIOS=1 nix run .#ci $NIX_CMD_OPTS -- --full --summary

      - name: Smoke mfm_cli --help
        run: |
          nix run .#mfm_cli $NIX_CMD_OPTS -- --help

      - name: Upload CI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts-full-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/mfm-ci-artifacts
          if-no-files-found: ignore
