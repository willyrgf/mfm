name: CI
permissions:
  contents: read
  pull-requests: write

on:
  push:

jobs:
  flake-check:
    name: Flake Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Nix cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/nix
          key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'flake.nix', 'nixfied.nix', 'nix/**', 'Cargo.lock', '.github/workflows/checks.yml') }}

      - name: Nix flake check
        run: |
          nix -L -v --log-format bar-with-logs flake check

  ci-full:
    name: Nixfied CI (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        runner:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Nix cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/nix
          key: nix-${{ runner.os }}-${{ runner.arch }}-${{ github.ref_name }}-${{ hashFiles('flake.lock', 'flake.nix', 'nixfied.nix', 'nix/**', 'Cargo.lock', '.github/workflows/checks.yml') }}

      - name: Nixfied CI
        env:
          NIXFIED_STATE_DIR: ${{ runner.temp }}/nixfied-state
        run: |
          nix -L -v --log-format bar-with-logs run .#ci -- --output both

      - name: Upload Nixfied failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nixfied-failure-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/nixfied-state/registry/mfm/**/runs/**/logs/**
            ${{ runner.temp }}/nixfied-state/registry/mfm/**/runs/**/artifacts/**
            ${{ runner.temp }}/nixfied-state/registry/mfm/**/runs/**/summary*.json
          if-no-files-found: warn
          retention-days: 7
