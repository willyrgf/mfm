[workspace]

resolver = "2"

members = [
	"bin/cli",
	"bin/rest-api",
	"tests/integration",
	"crates/app",
	"crates/collectors/exec",
	"crates/collectors/evm",
	"crates/collectors/evm-jsonrpc-http",
	"crates/collectors/nix",
	"crates/collectors/nix-exec",
	"crates/core",
	"crates/evm-core",
	"crates/evm-runtime",
	"crates/machine",
	"crates/machine-derive",
	"crates/machine-test-support",
	"crates/sdk",
	"crates/ops/common",
	"crates/ops/keystore-common",
	"crates/ops/aave-v3-common",
	"crates/storages/artifact-store-fs",
	"crates/storages/artifact-store-secret",
	"crates/storages/artifact-store-s3",
	"crates/storages/indexer",
	"crates/storages/event-store-mem",
	"crates/storages/event-store-postgres",
	"crates/transports/local-evm",
	"crates/transports/local-fs",
	"crates/transports/local-keystore",
	"crates/transports/proof",
	"crates/ops/keystore-op",
	"crates/ops/keystore-tx-op",
	"crates/ops/keystore-admin-op",
	"crates/ops/evm-read-op",
	"crates/ops/evm-write-op",
	"crates/ops/evm-deploy-configure-validate-op",
	"crates/ops/portfolio-tracker-op",
	"crates/ops/nix-app-op",
	"crates/ops/aave-v3-origin-adapt-op",
	"crates/ops/proof-op",
	"crates/tools/architecture-verify",
]

# Core dependencies
[workspace.dependencies]
# Alloy blockchain library components
alloy-primitives = "0.8"
alloy-sol-types = "0.8"
alloy-json-abi = "0.8"
alloy-dyn-abi = "0.8"
alloy-provider = "0.13"
alloy-contract = "0.13"
alloy-consensus = "0.13"
alloy-network = "0.13"
alloy-rpc-client = "0.13" 
alloy-transport-http = "0.13"
alloy-signer = "0.13"
# Cryptography dependency
ring = "0.17.14"
# Common dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.108"
serde_yaml = "0.9"
anyhow = "1.0.75"
tokio = { version = "1.44", features = ["full"] }
clap = { version = "4.4", features = ["derive"] }
url = "2.5"
thiserror = "2.0"
hex = "0.4"
rand = "0.9"
async-trait = "0.1"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.ci]
inherits = "test"
debug = 1
incremental = true
codegen-units = 256
