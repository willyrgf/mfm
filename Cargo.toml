[workspace]

resolver = "2"

members = [
	"bin/cli",
	"bin/rest-api",
	"crates/app",
	"crates/catalog",
	"crates/live/evm",
	"crates/keystore",
	"crates/kernel/canonical",
	"crates/kernel/capabilities",
	"crates/kernel/journal",
	"crates/kernel/ids",
	"crates/kernel/program",
	"crates/kernel/program-derive",
	"crates/kernel/runtime",
	"crates/kernel/store",
	"crates/kernel/values",
	"crates/domains/evm",
	"crates/domains/portfolio",
	"crates/signing",
	"crates/storages/postgres",
	"crates/transport-security",
]

# Core dependencies
[workspace.dependencies]
# Cryptography dependency
ring = "0.17.14"
# Common dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0.108", features = ["raw_value"] }
tokio = { version = "1.44", features = ["full"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres"] }
clap = { version = "4.4", features = ["derive"] }
thiserror = "2.0.18"
rustls = { version = "=0.23.42", default-features = false, features = ["std", "ring", "tls12"] }
webpki-roots = "=1.0.9"
url = "=2.5.8"
percent-encoding = "=2.3.2"
libc = "=0.2.186"
# Live EVM transport and wire codecs. Only `mfm-evm-live` may depend on `alloy-*`.
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls-manual-roots"] }
alloy-primitives = { version = "1.6.1", default-features = false, features = ["std"] }
toml = "=0.8.23"
getrandom = "=0.3.4"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "original-uri", "tokio"] }

# Keep full debugger-quality DWARF without embedding a copy into every linked
# test and integration-test executable.
[profile.dev]
split-debuginfo = "unpacked"

[profile.test]
split-debuginfo = "unpacked"

[patch.crates-io]
sqlx-core = { path = "vendor/sqlx-core-0.9.0" }
sqlx-postgres = { path = "vendor/sqlx-postgres-0.9.0" }
