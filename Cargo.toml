[workspace]

resolver = "2"

members = [
	"bin/cli",
	"bin/rest-api",
	"tests/integration",
	"crates/app",
	"crates/transports/btc-jsonrpc-http",
	"crates/core",
	"crates/kernel/canonical",
	"crates/kernel/capabilities",
	"crates/kernel/certify",
	"crates/kernel/events",
	"crates/kernel/facts",
	"crates/kernel/ids",
	"crates/kernel/manual-auth",
	"crates/kernel/program",
	"crates/kernel/program-derive",
	"crates/kernel/replay",
	"crates/kernel/runtime",
	"crates/kernel/spec",
	"crates/kernel/store",
	"crates/kernel/values",
	"crates/btc-capabilities",
	"crates/evm-capabilities",
	"crates/adapters/btc-jsonrpc",
"crates/adapters/evm",
	"crates/adapters/portfolio",
	"crates/signing",
	"crates/evm-signing",
	"crates/signers/keystore",
	"crates/runtime-config",
	"crates/portfolio/model",
	"crates/states/evm",
	"crates/states/btc",
	"crates/states/portfolio",
	"crates/storages/postgres",
	"crates/transports/evm",
	"crates/ops/btc-collectors-op",
	"crates/ops/evm-collectors-op",
	"crates/ops/portfolio-snapshot-op",
]

# Core dependencies
[workspace.dependencies]
# Alloy blockchain library components
alloy-primitives = "0.8"
alloy-consensus = "0.8.3"
alloy-eips = "0.8"
# Alloy 0.8's EIP-7702 manifest omits the derive feature used by its source.
derive_more = { version = "1.0.0", features = ["display"] }
# Bitcoin protocol primitives
bitcoin = { version = "0.32.102", default-features = false, features = ["std"] }
# Cryptography dependency
ring = "0.17.14"
# Common dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.108"
anyhow = "1.0.75"
tokio = { version = "1.44", features = ["full"] }
clap = { version = "4.4", features = ["derive"] }
url = "2.5"
hex = "0.4"
http = "1"
rand = "0.9"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "2.0.18"

# Keep full debugger-quality DWARF without embedding a copy into every linked
# test and integration-test executable.
[profile.dev]
split-debuginfo = "unpacked"

[profile.test]
split-debuginfo = "unpacked"
