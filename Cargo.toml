[workspace]

resolver = "2"

members = [
	"bin/cli",
	"bin/rest-api",
	"tests/integration",
	"crates/app",
	"crates/app-legacy",
	"crates/collectors/exec",
	"crates/collectors/evm",
	"crates/collectors/btc-jsonrpc-http",
	"crates/collectors/evm-jsonrpc-http",
	"crates/collectors/local-evm",
	"crates/collectors/local-keystore",
	"crates/collectors/nix",
	"crates/collectors/nix-exec",
	"crates/collectors/proof",
	"crates/collectors/rpc-control",
	"crates/control-plane/model",
	"crates/core",
	"crates/docs",
	"crates/kernel/canonical",
	"crates/kernel/capabilities",
	"crates/kernel/certify",
	"crates/kernel/effects",
	"crates/kernel/events",
	"crates/kernel/ids",
	"crates/kernel/program",
	"crates/kernel/program-derive",
	"crates/kernel/replay",
	"crates/kernel/runtime",
	"crates/kernel/spec",
	"crates/kernel/store",
	"crates/kernel/test-support",
	"crates/kernel/values",
	"crates/evm-dcv-model",
	"crates/evm-core",
	"crates/evm-runtime",
	"crates/machine",
	"crates/machine-derive",
	"crates/machine-test-support",
	"crates/sdk",
	"crates/authored-config",
	"crates/evm-deploy-configure-validate-config",
	"crates/portfolio-config",
	"crates/portfolio/model",
	"crates/portfolio/plan",
	"crates/states/common",
	"crates/states/keystore",
	"crates/states/aave-v3",
	"crates/states/portfolio",
	"crates/storages/artifact-store-fs",
	"crates/storages/artifact-store-secret",
	"crates/storages/artifact-store-s3",
	"crates/storages/control-plane-postgres",
	"crates/storages/stream-store-mem",
	"crates/storages/stream-store-postgres",
	"crates/transports/exec",
	"crates/transports/local-evm",
	"crates/transports/local-fs",
	"crates/transports/local-keystore",
	"crates/transports/process-exec",
	"crates/transports/portfolio",
	"crates/transports/proof",
	"crates/transports/rpc-control",
	"crates/ops/keystore-op",
	"crates/ops/evm-read-op",
	"crates/ops/evm-write-op",
	"crates/ops/evm-deploy-configure-validate-op",
	"crates/ops/portfolio-tracker-op",
	"crates/ops/nix-app-op",
	"crates/ops/proof-op",
	"crates/tools/publish-docs",
]

# Core dependencies
[workspace.dependencies]
# Alloy blockchain library components
alloy-primitives = "0.8"
bs58 = "0.5.1"
# Cryptography dependency
ring = "0.17.14"
# Common dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.108"
anyhow = "1.0.75"
tokio = { version = "1.44", features = ["full"] }
clap = { version = "4.4", features = ["derive"] }
url = "2.5"
thiserror = "2.0"
hex = "0.4"
rand = "0.9"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = "0.3"

# Canonical Rust compilation profile for nix run .#ci workflows.
[profile.ci]
inherits = "test"
debug = 0
incremental = true
codegen-units = 256
