[workspace]

resolver = "2"

members = [
	"bin/cli",
	"bin/rest-api",
	"tests/integration",
	"crates/app",
	"crates/transports/btc-jsonrpc-http",
	"crates/collectors/proof",
	"crates/core",
	"crates/kernel/canonical",
	"crates/kernel/capabilities",
	"crates/kernel/certify",
	"crates/kernel/effects",
	"crates/kernel/events",
	"crates/kernel/facts",
	"crates/kernel/ids",
	"crates/kernel/manual-auth",
	"crates/kernel/program",
	"crates/kernel/program-derive",
	"crates/kernel/replay",
	"crates/kernel/runtime",
	"crates/kernel/spec",
	"crates/kernel/store",
	"crates/kernel/values",
	"crates/catalog-model",
	"crates/evm-contract-model",
	"crates/evm-core",
	"crates/btc-capabilities",
	"crates/evm-capabilities",
	"crates/fact-capabilities",
	"crates/artifact-capabilities",
	"crates/adapter-contracts",
	"crates/adapters/btc-jsonrpc",
	"crates/adapters/evm-contracts",
"crates/adapters/evm",
	"crates/adapters/portfolio",
	"crates/signing",
	"crates/evm-signing",
	"crates/signers/keystore",
	"crates/runtime-config",
	"crates/portfolio/model",
	"crates/states/evm-contracts",
	"crates/states/evm",
	"crates/states/btc",
	"crates/states/portfolio",
	"crates/storages/postgres",
	"crates/transports/evm",
	"crates/transports/proof",
	"crates/ops/evm-contract-lifecycle-op",
"crates/ops/evm-collectors-op",
	"crates/ops/btc-collectors-op",
	"crates/ops/portfolio-tracker-op",
	"crates/ops/portfolio-collect-report-op",
	"crates/ops/proof-op",
]

# Core dependencies
[workspace.dependencies]
# Alloy blockchain library components
alloy-primitives = "0.8"
bech32 = "0.12"
bs58 = "0.5.1"
# Cryptography dependency
ring = "0.17.14"
# Common dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.108"
anyhow = "1.0.75"
tokio = { version = "1.44", features = ["full"] }
clap = { version = "4.4", features = ["derive"] }
url = "2.5"
hex = "0.4"
rand = "0.9"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "2.0.18"

# Keep full debugger-quality DWARF without embedding a copy into every linked
# test and integration-test executable.
[profile.dev]
split-debuginfo = "unpacked"

[profile.test]
split-debuginfo = "unpacked"

# Canonical Rust compilation profile for nix run .#ci workflows.
[profile.ci]
inherits = "test"
codegen-units = 256
