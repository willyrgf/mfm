[package]
name = "mfm"
version = "0.1.0"
edition = "2021"
autolib = false
autobins = false
autotests = false

[package.metadata.mfm]
layer = "binary"

[dependencies]
mfm-app = { path = "../../crates/app" }
mfm-ids = { path = "../../crates/kernel/ids" }
mfm-runtime = { path = "../../crates/kernel/runtime" }
clap = { workspace = true }
getrandom = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
mfm-config = { path = "../../crates/config" }
mfm-store = { path = "../../crates/kernel/store" }

[[bin]]
name = "mfm_cli"
path = "src/main.rs"
