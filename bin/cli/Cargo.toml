[package]
name = "mfm"
version = "0.1.0"
edition = "2021"
autolib = false
autobins = false
autotests = false

[package.metadata.mfm]
layer = "binary"

[dependencies]
mfm-app = { path = "../../crates/app" }
mfm-evm = { path = "../../crates/domains/evm" }
mfm-evm-live = { path = "../../crates/live/evm" }
mfm-ids = { path = "../../crates/kernel/ids" }
mfm-portfolio = { path = "../../crates/domains/portfolio" }
mfm-runtime = { path = "../../crates/kernel/runtime" }
mfm-storage-postgres = { path = "../../crates/storages/postgres" }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
sqlx = { workspace = true }

[[bin]]
name = "mfm_cli"
path = "src/main.rs"

[[test]]
name = "cli_e2e"
path = "tests/cli_e2e.rs"
