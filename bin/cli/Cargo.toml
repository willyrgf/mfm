[package]
name = "mfm"
version = "0.1.0"
edition = "2021"
autolib = false
autobins = false
autotests = false

[package.metadata.mfm]
layer = "binary"

[dependencies]
mfm-app = { path = "../../crates/app" }
mfm-ids = { path = "../../crates/kernel/ids" }
mfm-runtime = { path = "../../crates/kernel/runtime" }
mfm-values = { path = "../../crates/kernel/values" }
mfm-canonical = { path = "../../crates/kernel/canonical" }
mfm-diagnostics = { path = "../../crates/kernel/diagnostics" }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
mfm-program = { path = "../../crates/kernel/program" }
mfm-store = { path = "../../crates/kernel/store" }
mfm-journal = { path = "../../crates/kernel/journal" }

[[bin]]
name = "mfm_cli"
path = "src/main.rs"
