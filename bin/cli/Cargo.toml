[package]
name = "mfm"
version = "0.1.29"
edition = "2021"

[features]
parity-tests = []

[dependencies]
tokio = { workspace = true }
mfm-machine = { path = "../../crates/machine" }
mfm-sdk = { path = "../../crates/sdk" }
mfm-app = { path = "../../crates/app" }
mfm-op-keystore-tx = { path = "../../crates/ops/keystore-tx-op" }
mfm-op-keystore-admin = { path = "../../crates/ops/keystore-admin-op" }
mfm-artifact-store-fs = { path = "../../crates/storages/artifact-store-fs" }
mfm-event-store-postgres = { path = "../../crates/storages/event-store-postgres" }
mfm-event-store-mem = { path = "../../crates/storages/event-store-mem" }
clap = { version = "4.4", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
hex = "0.4"

[dev-dependencies]
mfm-op-keystore = { package = "mfm-op-keystore-shim", path = "../../crates/ops/keystore-op" }
tempfile = "3.0"
assert_cmd = "2.0"
predicates = "3.0"
rand = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[[bin]]
name = "mfm_cli"
path = "src/main.rs"
