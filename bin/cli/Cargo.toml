[package]
name = "mfm"
version = "0.1.29"
edition = "2021"

[dependencies]
tokio = { workspace = true }
tracing = "0.1"
tracing-subscriber = "0.3"
mfm_core = { path = "../../crates/core" }
clap = { version = "4.4", features = ["derive", "env"] }
rpassword = "7.0"
tabled = "0.15"
regex = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"

[dev-dependencies]
tempfile = "3.0"
assert_cmd = "2.0"
predicates = "3.0"

[[bin]]
name = "mfm_cli"
path = "src/main.rs"
