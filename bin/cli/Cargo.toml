[package]
name = "mfm"
version = "0.1.29"
edition = "2021"

[package.metadata.mfm]
layer = "binary"

[dependencies]
tokio = { workspace = true }
mfm-app = { path = "../../crates/app" }
mfm-ids = { path = "../../crates/kernel/ids" }
clap = { version = "4.4", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
regex = "1.0"
rpassword = "7.0"
zeroize = "1.7"
tempfile = "3.0"

[dev-dependencies]
mfm-app = { path = "../../crates/app", features = ["test-support"] }
mfm-canonical = { path = "../../crates/kernel/canonical" }
assert_cmd = "2.0"
predicates = "3.0"
rand = { workspace = true }
static_assertions = "1"

[[bin]]
name = "mfm_cli"
path = "src/main.rs"
