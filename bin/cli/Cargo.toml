[package]
name = "mfm"
version = "0.1.29"
edition = "2021"

[package.metadata.mfm]
layer = "binary"

[features]
parity-tests = ["mfm-app/test-support"]

[dependencies]
tokio = { workspace = true }
mfm-app = { path = "../../crates/app" }
mfm-canonical = { path = "../../crates/kernel/canonical" }
mfm-ids = { path = "../../crates/kernel/ids" }
mfm-store = { path = "../../crates/kernel/store" }
clap = { version = "4.4", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
hex = "0.4"
regex = "1.0"
rpassword = "7.0"
zeroize = "1.7"

[dev-dependencies]
alloy-primitives = { workspace = true }
axum = "0.7"
mfm-app = { path = "../../crates/app", features = ["test-support"] }
mfm-certify = { path = "../../crates/kernel/certify" }
mfm-events = { path = "../../crates/kernel/events" }
mfm-evm = { path = "../../crates/domains/evm" }
mfm-program = { path = "../../crates/kernel/program" }
mfm-runtime = { path = "../../crates/kernel/runtime" }
mfm-store = { path = "../../crates/kernel/store", features = ["test-support"] }
mfm-rest-api = { path = "../rest-api" }
tempfile = "3.0"
assert_cmd = "2.0"
predicates = "3.0"
rand = { workspace = true }
static_assertions = "1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-none", "postgres"] }
tower = "0.5"

[[bin]]
name = "mfm_cli"
path = "src/main.rs"
