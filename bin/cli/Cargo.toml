[package]
name = "mfm"
version = "0.1.0"
edition = "2021"
autolib = false
autobins = false
autotests = false

[package.metadata.mfm]
layer = "binary"

[dependencies]
mfm-app = { path = "../../crates/app" }
mfm-catalog = { path = "../../crates/catalog" }
mfm-ids = { path = "../../crates/kernel/ids" }
mfm-runtime = { path = "../../crates/kernel/runtime" }
clap = { workspace = true }
getrandom = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[[bin]]
name = "mfm_cli"
path = "src/main.rs"

[[test]]
name = "cli_e2e"
path = "tests/cli_e2e.rs"
