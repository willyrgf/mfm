[package]
name = "mfm"
version = "0.1.29"
edition = "2021"

[features]
parity-tests = []

[dependencies]
tokio = { workspace = true }
mfm-app = { path = "../../crates/app" }
mfm-artifact-store-fs = { path = "../../crates/storages/artifact-store-fs" }
mfm-canonical = { path = "../../crates/kernel/canonical" }
mfm-stream-store-postgres = { path = "../../crates/storages/stream-store-postgres" }
mfm-ids = { path = "../../crates/kernel/ids" }
mfm-op-portfolio-tracker = { path = "../../crates/ops/portfolio-tracker-op" }
mfm-portfolio-config = { path = "../../crates/portfolio-config" }
mfm-evm-core = { path = "../../crates/evm-core" }
mfm_core = { path = "../../crates/core" }
clap = { version = "4.4", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.0"
rpassword = "7.5"
zeroize = "1.7"

[dev-dependencies]
mfm-op-proof = { path = "../../crates/ops/proof-op" }
mfm-spec = { path = "../../crates/kernel/spec" }
tempfile = "3.0"
assert_cmd = "2.0"
predicates = "3.0"
rand = { workspace = true }

[[bin]]
name = "mfm_cli"
path = "src/main.rs"
