[package]
name = "mfm"
version = "0.1.29"
edition = "2021"

[features]
parity-tests = []

[dependencies]
tokio = { workspace = true }
mfm-machine = { path = "../../crates/machine" }
mfm-app = { path = "../../crates/app" }
mfm-app-legacy = { package = "mfm-app-legacy", path = "../../crates/app-legacy" }
mfm-artifact-store-fs = { path = "../../crates/storages/artifact-store-fs" }
mfm-stream-store-postgres = { path = "../../crates/storages/stream-store-postgres" }
mfm-stream-store-mem = { path = "../../crates/storages/stream-store-mem" }
mfm-ids = { path = "../../crates/kernel/ids" }
clap = { version = "4.4", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
hex = "0.4"

[dev-dependencies]
mfm_core = { path = "../../crates/core" }
mfm-portfolio-model = { path = "../../crates/portfolio/model" }
mfm-op-portfolio-tracker = { path = "../../crates/ops/portfolio-tracker-op" }
tempfile = "3.0"
assert_cmd = "2.0"
predicates = "3.0"
rand = { workspace = true }

[[bin]]
name = "mfm_cli"
path = "src/main.rs"
