[package]
name = "mfm"
version = "0.1.29"
edition = "2021"

[features]
parity-tests = []

[dependencies]
tokio = { workspace = true }
mfm-machine = { path = "../../crates/machine" }
mfm-sdk = { path = "../../crates/sdk" }
mfm-app = { path = "../../crates/app" }
mfm-evm-deploy-configure-validate-config = { path = "../../crates/evm-deploy-configure-validate-config" }
mfm-portfolio-config = { path = "../../crates/portfolio-config" }
mfm-op-keystore-tx = { path = "../../crates/ops/keystore-tx-op" }
mfm-op-keystore-admin = { path = "../../crates/ops/keystore-admin-op" }
mfm-artifact-store-fs = { path = "../../crates/storages/artifact-store-fs" }
mfm-stream-store-postgres = { path = "../../crates/storages/stream-store-postgres" }
mfm-stream-store-mem = { path = "../../crates/storages/stream-store-mem" }
clap = { version = "4.4", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
hex = "0.4"

[dev-dependencies]
mfm-op-keystore = { package = "mfm-op-keystore-shim", path = "../../crates/ops/keystore-op" }
mfm-state-portfolio = { path = "../../crates/states/portfolio" }
mfm-state-symbol = { path = "../../crates/states/symbol" }
mfm-op-portfolio-tracker = { path = "../../crates/ops/portfolio-tracker-op" }
tempfile = "3.0"
assert_cmd = "2.0"
predicates = "3.0"
rand = { workspace = true }

[[bin]]
name = "mfm_cli"
path = "src/main.rs"
