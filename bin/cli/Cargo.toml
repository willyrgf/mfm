[package]
name = "mfm"
version = "0.1.29"
edition = "2021"

[package.metadata.mfm]
category = "binary"

[features]
parity-tests = ["mfm-app/test-support"]

[dependencies]
tokio = { workspace = true }
thiserror = { workspace = true }
mfm-app = { path = "../../crates/app" }
mfm-canonical = { path = "../../crates/kernel/canonical" }
mfm-ids = { path = "../../crates/kernel/ids" }
mfm-store = { path = "../../crates/kernel/store" }
mfm-evm-core = { path = "../../crates/evm-core" }
mfm-runtime-config = { path = "../../crates/runtime-config" }
mfm_core = { path = "../../crates/core" }
clap = { version = "4.4", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.0"
rpassword = "7.0"
zeroize = "1.7"

[dev-dependencies]
axum = "0.7"
mfm-certify = { path = "../../crates/kernel/certify" }
mfm-events = { path = "../../crates/kernel/events" }
mfm-manual-auth = { path = "../../crates/kernel/manual-auth" }
mfm-op-btc-collectors = { path = "../../crates/ops/btc-collectors-op" }
mfm-op-evm-collectors = { path = "../../crates/ops/evm-collectors-op" }
mfm-op-proof = { path = "../../crates/ops/proof-op" }
mfm-op-portfolio-tracker = { path = "../../crates/ops/portfolio-tracker-op" }
mfm-program = { path = "../../crates/kernel/program" }
mfm-runtime = { path = "../../crates/kernel/runtime" }
mfm-spec = { path = "../../crates/kernel/spec" }
mfm-store = { path = "../../crates/kernel/store", features = ["test-support"] }
mfm-rest-api = { path = "../rest-api" }
tempfile = "3.0"
assert_cmd = "2.0"
predicates = "3.0"
rand = { workspace = true }
k256 = { version = "0.13.0", features = ["ecdsa"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-none", "postgres"] }
tower = "0.5"

[[bin]]
name = "mfm_cli"
path = "src/main.rs"
