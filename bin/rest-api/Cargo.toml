[package]
name = "mfm-rest-api"
version = "0.1.0"
edition = "2021"

[package.metadata.mfm]
layer = "binary"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
clap = { workspace = true }

axum = "0.7"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["trace"] }
url = "2"

mfm-app = { path = "../../crates/app" }
mfm-canonical = { path = "../../crates/kernel/canonical" }
mfm-ids = { path = "../../crates/kernel/ids" }

[features]
parity-tests = []

[dev-dependencies]
async-trait = { workspace = true }
mfm-app = { path = "../../crates/app", features = ["test-support"] }
tower = "0.5"

[[bin]]
name = "mfm_rest_api"
path = "src/main.rs"
