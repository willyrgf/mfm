[package]
name = "mfm-rest-api"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

axum = "0.7"
tower-http = { version = "0.6", features = ["request-id", "trace"] }
http = "1"
uuid = { version = "1.0", features = ["v4"] }

mfm-machine = { path = "../../crates/machine" }
mfm-app = { package = "mfm-app-legacy", path = "../../crates/app-legacy" }

[features]
parity-tests = []

[dev-dependencies]
async-trait = { workspace = true }

[[bin]]
name = "mfm_rest_api"
path = "src/main.rs"
