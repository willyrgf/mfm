[package]
name = "mfm-rest-api"
version = "0.1.0"
edition = "2021"

[package.metadata.mfm]
category = "binary"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }

axum = "0.7"
tower-http = { version = "0.6", features = ["request-id", "trace"] }
http = "1"
url = "2"

mfm-app = { path = "../../crates/app" }
mfm-canonical = { path = "../../crates/kernel/canonical" }
mfm-ids = { path = "../../crates/kernel/ids" }
mfm-store = { path = "../../crates/kernel/store" }

[features]
parity-tests = []

[dev-dependencies]
mfm-app = { path = "../../crates/app", features = ["test-support"] }
mfm-facts = { path = "../../crates/kernel/facts" }
mfm-store = { path = "../../crates/kernel/store", features = ["test-support"] }
tower = "0.5"

[[bin]]
name = "mfm_rest_api"
path = "src/main.rs"
