[package]
name = "mfm-rest-api"
version = "0.1.0"
edition = "2021"
autolib = false
autobins = false
autotests = false

[package.metadata.mfm]
layer = "binary"

[dependencies]
axum = "0.7"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
mfm-app = { path = "../../crates/app" }
mfm-ids = { path = "../../crates/kernel/ids" }

[[bin]]
name = "mfm_rest_api"
path = "src/main.rs"
