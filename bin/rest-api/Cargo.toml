[package]
name = "mfm-rest-api"
version = "0.1.0"
edition = "2021"
autolib = false
autobins = false
autotests = false

[package.metadata.mfm]
layer = "binary"

[dependencies]
mfm-canonical = { path = "../../crates/kernel/canonical" }
mfm-app = { path = "../../crates/app" }
mfm-ids = { path = "../../crates/kernel/ids" }
mfm-runtime = { path = "../../crates/kernel/runtime" }
mfm-values = { path = "../../crates/kernel/values" }
axum = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
# A failed prepared response yields its retained native cause through the HTTP body.
tokio-stream = { version = "=0.1.19", default-features = false }

[dev-dependencies]
mfm-portfolio = { path = "../../crates/domains/portfolio" }
mfm-canonical = { path = "../../crates/kernel/canonical" }
mfm-journal = { path = "../../crates/kernel/journal" }
reqwest = { workspace = true }
mfm-capabilities = { path = "../../crates/kernel/capabilities" }
libc = { workspace = true }
mfm-config = { path = "../../crates/config" }
mfm-evm = { path = "../../crates/domains/evm" }
mfm-evm-live = { path = "../../crates/live/evm" }
mfm-store = { path = "../../crates/kernel/store" }
tower = { version = "=0.5.3", features = ["util"] }

[[bin]]
name = "mfm_rest_api"
path = "src/main.rs"

[[test]]
name = "client_execution_e2e"
path = "tests/client_execution_e2e.rs"
