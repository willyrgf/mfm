# EVM-only runtime route for the token-only portfolio snapshot example.
# Set MFM_ETHEREUM_MAINNET_RPC_URL locally; endpoint material never enters setup or run evidence.

[evm.routes.ethereum-mainnet]
source_ref = "ethereum-mainnet"
chain_id = 1
generation_id = "ethereum-mainnet-primary-v1"
rpc_url = { env = "MFM_ETHEREUM_MAINNET_RPC_URL" }
