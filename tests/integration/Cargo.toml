[package]
name = "mfm-integration-tests"
version = "0.1.0"
edition = "2021"

[package.metadata.mfm]
category = "test-support"

[features]
parity-tests = []

[dependencies]
axum = "0.7"
ed25519-dalek = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { version = "1.0", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
tempfile = "3.0"
tokio = { workspace = true }
mfm-app = { path = "../../crates/app", features = ["test-support"] }
mfm-authored-config = { path = "../../crates/authored-config" }
mfm-events = { path = "../../crates/kernel/events" }
mfm-ids = { path = "../../crates/kernel/ids" }
mfm-canonical = { path = "../../crates/kernel/canonical" }
mfm-facts = { path = "../../crates/kernel/facts" }
mfm-spec = { path = "../../crates/kernel/spec" }
mfm-certify = { path = "../../crates/kernel/certify" }
mfm-program = { path = "../../crates/kernel/program" }
mfm-manual-auth = { path = "../../crates/kernel/manual-auth" }
mfm-store = { path = "../../crates/kernel/store", features = ["test-support"] }
mfm-stream-store-postgres = { path = "../../crates/storages/stream-store-postgres" }
mfm-adapters-btc-jsonrpc = { path = "../../crates/adapters/btc-jsonrpc" }
mfm-adapters-portfolio = { path = "../../crates/adapters/portfolio" }
mfm-artifact-capabilities = { path = "../../crates/artifact-capabilities" }
mfm-btc-capabilities = { path = "../../crates/btc-capabilities" }
mfm-fact-capabilities = { path = "../../crates/fact-capabilities" }
mfm-op-proof = { path = "../../crates/ops/proof-op" }
mfm-op-btc-collectors = { path = "../../crates/ops/btc-collectors-op" }
mfm-op-evm-contract-lifecycle = { path = "../../crates/ops/evm-contract-lifecycle-op" }
mfm-states-btc = { path = "../../crates/states/btc" }
mfm-states-evm = { path = "../../crates/states/evm" }
mfm-runtime = { path = "../../crates/kernel/runtime" }
mfm-op-portfolio-tracker = { path = "../../crates/ops/portfolio-tracker-op" }
mfm-portfolio-config = { path = "../../crates/portfolio-config" }
mfm_core = { path = "../../crates/core" }
mfm-rest-api = { path = "../../bin/rest-api" }

[dev-dependencies]
alloy-primitives = { workspace = true }
k256 = { version = "0.13.0", features = ["ecdsa"] }
mfm-evm-contract-config = { path = "../../crates/evm-contract-config" }
mfm-evm-contract-model = { path = "../../crates/evm-contract-model" }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-none", "postgres"] }
tower = "0.5"
