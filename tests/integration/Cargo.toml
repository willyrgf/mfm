[package]
name = "mfm-integration-tests"
version = "0.1.0"
edition = "2021"

[features]
parity-tests = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { version = "1.0", features = ["v4"] }
mfm-machine = { path = "../../crates/machine" }
