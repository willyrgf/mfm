[package]
name = "mfm-qualified-run-test-support"
version = "0.1.0"
edition = "2021"
description = "Dev-only genuine qualified-run fixtures for MFM backend conformance"
repository = "https://github.com/willyrgf/mfm"
license = "MIT"

[package.metadata.mfm]
layer = "test"
domain-facing = false
binary-facing = false

[lib]
name = "mfm_qualified_run_test_support"
path = "src/lib.rs"

[dependencies]
mfm-canonical = { path = "../../crates/kernel/canonical" }
mfm-certify = { path = "../../crates/kernel/certify" }
mfm-ids = { path = "../../crates/kernel/ids" }
mfm-journal = { path = "../../crates/kernel/journal" }
mfm-program = { path = "../../crates/kernel/program" }
mfm-program-derive = { path = "../../crates/kernel/program-derive" }
mfm-spec = { path = "../../crates/kernel/spec" }
mfm-store = { path = "../../crates/kernel/store" }
mfm-values = { path = "../../crates/kernel/values" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
