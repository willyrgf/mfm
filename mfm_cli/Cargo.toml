[package]
name = "mfm"
version = "0.1.29"
edition = "2021"

[dependencies]
serde_yaml = "0.9"
serde_json = "1.0"
serde = "1.0"
clap = "4.0"
tokio = { version = "1.0", features = ["full"] }
alloy-primitives = "0.3.1"
alloy-provider = "0.3.1"
alloy-rpc-client = "0.3.1"
alloy-transport-http = "0.3.1"
alloy-signer = "0.3.1"
url = "2.0"
mfm_core = { path = "../mfm_core" }
mfm_machine = { path = "../mfm_machine" }
hex = "0.4"
ring = "0.17"
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "1.0"
anyhow = "1.0"

[[bin]]
name = "mfm_cli"
path = "src/main.rs"
