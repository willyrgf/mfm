[package]
name = "mfm_core"
version = "0.1.29"
edition = "2021"

[lib]
name = "mfm_core"
path = "src/lib.rs"

[dependencies]
mfm_machine_derive = { path = "../mfm_machine_derive" }
mfm_machine = { path = "../mfm_machine" }

serde = "1.0"
serde_json = "1.0"
serde_derive = "1.0"
serde_yaml = "0.9"
anyhow = "1.0"

pbkdf2 = "0.12"
sha2 = "0.10"
sha3 = "0.10"
generic-array = "0.14"
crypto-common = "0.1"
cipher = "0.4"
lazy_static = "1.5.0"
reqwest = { version = "0.12.14", features = ["json"] }
tiny-keccak = { version = "2.0", features = ["keccak"] }
argon2 = "0.5.3"
aes-gcm = "0.10.1"
bip39 = "2.0.0"
bip32 = "0.4.0"
k256 = { version = "0.13.0", features = ["ecdsa"] }
dirs-next = "2.0.0"
uuid = { version = "1.8.0", features = ["serde", "v4"] }
zeroize = { version = "1.7.0", features = ["zeroize_derive", "alloc"] }
base64 = "0.22.1"
chrono = { version = "0.4.38", features = ["serde"] }
rand_core = "0.6.4"
atomicwrites = "0.4.4"
fs2 = "0.4.3"
alloy-primitives = "1.1"
alloy-signer = { version = "1.0" }
alloy-signer-local = "1.0"
signature = "2.0.0"
hex = "0.4.3"
thiserror = "2.0.12"
ring = "0.17.14"
subtle = "2.5"

[dev-dependencies]
tempfile = "3.8"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = [
    "aclapi", "securitybaseapi", "winnt", "fileapi", 
    "errhandlingapi", "processthreadsapi", "handleapi", 
    "minwindef", "lmcons", "sddl", "accctrl"
]}
