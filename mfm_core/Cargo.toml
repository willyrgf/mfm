[package]
name = "mfm_core"
version = "0.1.29"
edition = "2021"

[lib]
name = "mfm_core"
path = "src/lib.rs"

[dependencies]
# mfm_core dependencies
argon2 = "0.5.3"
aes-gcm = "0.10"
bip39 = "2.0"
k256 = { version = "0.13", features = ["ecdsa", "serde"] }
tiny-keccak = { version = "2.0", features = ["sha3"] }
slip10 = "0.4"
uuid = { version = "1.8", features = ["v4", "serde"] }
dirs-next = "2.0"
base64 = "0.21"
rand_core = { version = "0.6" } # Added rng feature
sha3 = "0.10" # Added missing dependency
reqwest = { version = "0.12", features = ["json"] }
lazy_static = "1.4" # Added missing dependency
mfm_machine = { path = "../mfm_machine" } # Added path dependency
mfm_machine_derive = { path = "../mfm_machine_derive" } # Added path dependency
zeroize = { version = "1.8", features = ["derive"] } # Added zeroize with derive feature
chrono = { version = "0.4", features = ["serde"] } # Added chrono with serde feature

# Dependencies moved from workspace
alloy-primitives = "1.0.1"
alloy-sol-types = "1.0.1"
alloy-json-abi = "1.0.1"
alloy-dyn-abi = "1.0.1"
alloy-provider = "1.0.1"
alloy-contract = "1.0.1"
alloy-consensus = "1.0.1"
alloy-network = "1.0.1"
alloy-rpc-client = "1.0.1"
alloy-transport-http = "1.0.1"
alloy-signer = "1.0.1" # Removed local feature
ring = "0.17.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.108"
serde_yaml = "0.9"
serde_derive = "1.0.193"
anyhow = "1.0.75"
tokio = { version = "1.44", features = ["full"] }
clap = { version = "4.4", features = ["derive"] }
url = "2.5"
thiserror = "2.0"
hex = "0.4"
rand = "0.6"
async-trait = "0.1"
futures = "0.3"
