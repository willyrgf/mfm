[package]
name = "mfm-op-portfolio-collect-report"
version = "0.1.0"
edition = "2021"
description = "Typed portfolio collector composition and fact-backed report operation"
repository = "https://github.com/willyrgf/mfm"
license = "MIT"

[package.metadata.mfm]
category = "operation"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

mfm-canonical = { path = "../../kernel/canonical", version = "0.1.0" }
mfm-capabilities = { path = "../../kernel/capabilities", version = "0.1.0" }
mfm-certify = { path = "../../kernel/certify", version = "0.1.0" }
mfm-effects = { path = "../../kernel/effects", version = "0.1.0" }
mfm-events = { path = "../../kernel/events", version = "0.1.0" }
mfm-facts = { path = "../../kernel/facts", version = "0.1.0" }
mfm-ids = { path = "../../kernel/ids", version = "0.1.0" }
mfm-op-btc-collectors = { path = "../btc-collectors-op", version = "0.1.0" }
mfm-op-evm-collectors = { path = "../evm-collectors-op", version = "0.1.0" }
mfm-op-portfolio-tracker = { path = "../portfolio-tracker-op", version = "0.1.0" }
mfm-portfolio-model = { path = "../../portfolio/model", version = "0.1.0" }
mfm-program = { path = "../../kernel/program", version = "0.1.0" }
mfm-program-derive = { path = "../../kernel/program-derive", version = "0.1.0" }
mfm-replay = { path = "../../kernel/replay", version = "0.1.0" }
mfm-state-portfolio = { path = "../../states/portfolio", version = "0.1.0" }
mfm-spec = { path = "../../kernel/spec", version = "0.1.0" }
mfm-store = { path = "../../kernel/store", version = "0.1.0" }
mfm-values = { path = "../../kernel/values", version = "0.1.0" }

[dev-dependencies]
mfm-states-btc = { path = "../../states/btc", version = "0.1.0" }
mfm-states-evm = { path = "../../states/evm", version = "0.1.0" }
