[package]
name = "mfm-op-evm-contract-lifecycle"
version = "0.1.0"
edition = "2021"
description = "Typed EVM contract lifecycle operation planning"
repository = "https://github.com/willyrgf/mfm"
license = "MIT"

[package.metadata.mfm]
category = "operation"

[dependencies]
mfm-canonical = { path = "../../kernel/canonical" }
mfm-certify = { path = "../../kernel/certify" }
mfm-evm-contract-model = { path = "../../evm-contract-model" }
mfm-ids = { path = "../../kernel/ids" }
mfm-program = { path = "../../kernel/program" }
mfm-program-derive = { path = "../../kernel/program-derive" }
mfm-spec = { path = "../../kernel/spec" }
mfm-state-evm-contracts = { path = "../../states/evm-contracts" }
mfm-values = { path = "../../kernel/values" }
serde = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
trybuild = "1.0"
