[package]
name = "mfm-evm-deploy-configure-validate-config"
version = "0.1.0"
edition = "2021"
description = "Shared authored and canonical config pipeline for deploy/configure/validate workflows"
repository = "https://github.com/willyrgf/mfm"
license = "MIT"

[package.metadata.mfm]
category = "domain-config"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = "0.8"

mfm-authored-config = { path = "../authored-config", version = "0.1.0" }
mfm-canonical = { path = "../kernel/canonical", version = "0.1.0" }
mfm-evm-dcv-model = { path = "../evm-dcv-model", version = "0.1.0" }
mfm-ids = { path = "../kernel/ids", version = "0.1.0" }
mfm-program-derive = { path = "../kernel/program-derive", version = "0.1.0" }
mfm-values = { path = "../kernel/values", version = "0.1.0" }
