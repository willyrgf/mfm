[package]
name = "mfm-evm-signing"
version = "0.1.0"
edition = "2021"
description = "EVM signing bridge contracts for MFM"
repository = "https://github.com/willyrgf/mfm"
license = "MIT"

[package.metadata.mfm]
category = "signer-contract"

[dependencies]
alloy-consensus = { workspace = true }
alloy-eips = { workspace = true }
alloy-primitives = { workspace = true, features = ["k256"] }
# Alloy 0.8's EIP-7702 dependency derives Display without enabling the
# corresponding derive-more feature in its published manifest.
derive_more = { version = "1.0.0", features = ["display"] }
thiserror = { workspace = true }

mfm-ids = { path = "../kernel/ids" }
mfm-signing = { path = "../signing" }

[dev-dependencies]
hex = { workspace = true }
mfm-values = { path = "../kernel/values" }
serde = { workspace = true }
tokio = { workspace = true }
trybuild = "1.0"
