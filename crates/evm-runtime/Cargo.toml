[package]
name = "mfm-evm-runtime"
version = "0.1.0"
edition = "2021"
description = "Reusable EVM read and write runtime states for MFM"
repository = "https://github.com/willyrgf/mfm"
license = "MIT"
readme = "README.md"

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
alloy-primitives = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }

mfm-machine = { path = "../machine", version = "0.1.0" }
mfm-collectors-rpc-control = { path = "../collectors/rpc-control", version = "0.1.0" }
mfm-state-common = { path = "../states/common", version = "0.1.0" }
mfm-evm-core = { path = "../evm-core", version = "0.1.0" }
mfm-transports-local-evm = { path = "../transports/local-evm", version = "0.1.0" }
