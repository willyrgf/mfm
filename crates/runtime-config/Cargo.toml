[package]
name = "mfm-runtime-config"
version = "0.1.0"
edition = "2021"
description = "Runtime-only capability configuration parsing and validation for MFM"
repository = "https://github.com/willyrgf/mfm"
license = "MIT"

[package.metadata.mfm]
category = "runtime-config"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
http = { workspace = true }
toml = "0.8"
url = { workspace = true }
uuid = { version = "1.8.0" }

mfm-btc-capabilities = { path = "../btc-capabilities" }
mfm-ids = { path = "../kernel/ids" }
mfm-signing = { path = "../signing" }

[dev-dependencies]
tempfile = "3.8"
