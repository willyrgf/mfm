[package]
name = "mfm-app"
version = "0.1.0"
edition = "2021"

[package.metadata.mfm]
layer = "assembly"
binary-facing = true

[features]
test-support = ["mfm-store/test-support"]

[dependencies]
alloy-primitives = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.0", features = ["v4"] }
thiserror = { workspace = true }
ring = { workspace = true }

mfm-adapters-evm = { path = "../adapters/evm" }
mfm-adapters-portfolio = { path = "../adapters/portfolio" }
mfm-bitcoin = { path = "../domains/bitcoin" }
mfm-bitcoin-live = { path = "../live/bitcoin" }
mfm-canonical = { path = "../kernel/canonical" }
mfm-capabilities = { path = "../kernel/capabilities" }
mfm-certify = { path = "../kernel/certify" }
mfm-events = { path = "../kernel/events" }
mfm-evm-capabilities = { path = "../evm-capabilities" }
mfm-evm-signing = { path = "../evm-signing" }
mfm-facts = { path = "../kernel/facts" }
mfm-ids = { path = "../kernel/ids" }
mfm-op-evm-collectors = { path = "../ops/evm-collectors-op" }
mfm-op-portfolio-snapshot = { path = "../ops/portfolio-snapshot-op" }
mfm-portfolio-model = { path = "../portfolio/model" }
mfm-program = { path = "../kernel/program" }
mfm-replay = { path = "../kernel/replay" }
mfm-runtime = { path = "../kernel/runtime" }
mfm-runtime-config = { path = "../runtime-config" }
mfm-state-portfolio = { path = "../states/portfolio" }
mfm-states-evm = { path = "../states/evm" }
mfm-signing = { path = "../signing" }
mfm-signers-keystore = { path = "../signers/keystore" }
mfm-spec = { path = "../kernel/spec" }
mfm-store = { path = "../kernel/store" }
mfm-storage-postgres = { path = "../storages/postgres" }
mfm-transports-evm = { path = "../transports/evm" }
mfm-values = { path = "../kernel/values" }
toml = "0.8"
url = { workspace = true }

[dev-dependencies]
alloy-primitives = { workspace = true }
k256 = { version = "0.13.0", features = ["ecdsa"] }
mfm-portfolio-model = { path = "../portfolio/model" }
mfm-program-derive = { path = "../kernel/program-derive" }
mfm-store = { path = "../kernel/store", features = ["test-support"] }
tempfile = "3.0"
trybuild = "1.0"
