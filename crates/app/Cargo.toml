[package]
name = "mfm-app"
version = "0.1.0"
edition = "2021"
autotests = false

[package.metadata.mfm]
layer = "assembly"
binary-facing = true

[features]
test-support = ["mfm-store/test-support"]

[dependencies]
alloy-primitives = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.0", features = ["v4"] }
thiserror = { workspace = true }
ring = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
zeroize = "1.7"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-none", "postgres"] }

mfm-canonical = { path = "../kernel/canonical" }
mfm-certify = { path = "../kernel/certify" }
mfm-evm = { path = "../domains/evm" }
mfm-evm-live = { path = "../live/evm" }
mfm-ids = { path = "../kernel/ids" }
mfm-journal = { path = "../kernel/journal" }
mfm-portfolio = { path = "../domains/portfolio" }
mfm-program = { path = "../kernel/program" }
mfm-replay = { path = "../kernel/replay" }
mfm-runtime = { path = "../kernel/runtime" }
mfm-signing = { path = "../signing" }
mfm-keystore = { path = "../keystore" }
mfm-spec = { path = "../kernel/spec" }
mfm-store = { path = "../kernel/store" }
mfm-storage-evm-postgres = { path = "../storages/evm-postgres" }
mfm-storage-postgres = { path = "../storages/postgres" }
mfm-values = { path = "../kernel/values" }
toml = "0.8"
url = { workspace = true }
tempfile = "3.0"

[dev-dependencies]
alloy-primitives = { workspace = true }
k256 = { version = "0.13.0", features = ["ecdsa"] }
mfm-store = { path = "../kernel/store", features = ["backend-conformance"] }
trybuild = "1.0"
static_assertions = "1"

[[test]]
name = "application-privacy-ui"
path = "tests/application_privacy_ui.rs"
