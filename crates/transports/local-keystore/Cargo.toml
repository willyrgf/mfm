[package]
name = "mfm-transports-local-keystore"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
zeroize = "1.7.0"
rpassword = "7.0"
regex = "1.0"

mfm-machine = { path = "../../machine" }
mfm-collectors-local-keystore = { path = "../../collectors/local-keystore" }
mfm-state-keystore = { path = "../../states/keystore" }
mfm_core = { path = "../../core" }
