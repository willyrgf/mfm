[package]
name = "mfm-transports-evm"
version = "0.1.0"
edition = "2021"
description = "Reusable EVM JSON-RPC transport for MFM"
repository = "https://github.com/willyrgf/mfm"
license = "MIT"

[package.metadata.mfm]
category = "transport"

[dependencies]
alloy-eips = { workspace = true }
alloy-primitives = { workspace = true, features = ["serde"] }
derive_more = { workspace = true }
hex = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }

mfm-capabilities = { path = "../../kernel/capabilities" }
mfm-evm-capabilities = { path = "../../evm-capabilities" }
mfm-ids = { path = "../../kernel/ids" }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
