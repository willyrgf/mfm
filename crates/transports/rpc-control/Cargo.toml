[package]
name = "mfm-transports-rpc-control"
version = "0.1.0"
edition = "2021"
description = "Live rpc.control transport for managed EVM RPC routing"
repository = "https://github.com/willyrgf/mfm"
license = "MIT"
readme = "README.md"

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

mfm-machine = { path = "../../machine", version = "0.1.0" }
mfm-collectors-rpc-control = { path = "../../collectors/rpc-control", version = "0.1.0" }
mfm-collectors-evm-jsonrpc-http = { path = "../../collectors/evm-jsonrpc-http", version = "0.1.0" }
mfm-control-plane-postgres = { path = "../../storages/control-plane-postgres", version = "0.1.0" }

[dev-dependencies]
tokio = { workspace = true }
