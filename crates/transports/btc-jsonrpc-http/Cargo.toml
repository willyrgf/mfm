[package]
name = "mfm-transports-btc-jsonrpc-http"
version = "0.1.0"
edition = "2021"
description = "Bitcoin Core JSON-RPC over HTTP client for managed Bitcoin IO"
repository = "https://github.com/willyrgf/mfm"
license = "MIT"

[package.metadata.mfm]
category = "transport"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
