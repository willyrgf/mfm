[package]
name = "mfm-transports-evm-dcv"
version = "0.1.0"
edition = "2021"
description = "Typed EVM deploy/configure/validate workflow runners"
repository = "https://github.com/willyrgf/mfm"
license = "MIT"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
zeroize = "1.7"

mfm-artifact-store-fs = { path = "../../storages/artifact-store-fs", default-features = false }
mfm-canonical = { path = "../../kernel/canonical" }
mfm-capabilities = { path = "../../kernel/capabilities" }
mfm-core = { package = "mfm_core", path = "../../core" }
mfm-events = { path = "../../kernel/events" }
mfm-evm-core = { path = "../../evm-core" }
mfm-evm-deploy-configure-validate-config = { path = "../../evm-deploy-configure-validate-config" }
mfm-ids = { path = "../../kernel/ids" }
mfm-program = { path = "../../kernel/program" }
mfm-replay = { path = "../../kernel/replay" }
mfm-runtime = { path = "../../kernel/runtime" }
mfm-spec = { path = "../../kernel/spec" }
mfm-state-evm-dcv = { path = "../../states/evm-dcv" }
mfm-store = { path = "../../kernel/store" }
mfm-values = { path = "../../kernel/values" }
