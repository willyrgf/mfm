[package]
name = "mfm-signing"
version = "0.1.0"
edition = "2021"
description = "Transient checked recoverable-secp256k1 signing contracts for MFM"
repository = "https://github.com/willyrgf/mfm"
license = "MIT"
readme = "README.md"

[package.metadata.mfm]
layer = "signing"

[dependencies]
k256 = { workspace = true }
mfm-ids = { path = "../kernel/ids" }
thiserror = { workspace = true }

[dev-dependencies]
serde = { workspace = true }
static_assertions = "1.1"
