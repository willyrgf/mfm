[package]
name = "mfm-adapters-portfolio"
version = "0.1.0"
edition = "2021"
description = "Portfolio adapter runners for typed fact-backed report execution"
repository = "https://github.com/willyrgf/mfm"
license = "MIT"

[package.metadata.mfm]
layer = "live"
domain = "portfolio"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

mfm-events = { path = "../../kernel/events" }
mfm-fact-capabilities = { path = "../../fact-capabilities" }
mfm-facts = { path = "../../kernel/facts" }
mfm-program = { path = "../../kernel/program" }
mfm-replay = { path = "../../kernel/replay" }
mfm-runtime = { path = "../../kernel/runtime" }
mfm-state-portfolio = { path = "../../states/portfolio" }
mfm-store = { path = "../../kernel/store" }
mfm-values = { path = "../../kernel/values" }
