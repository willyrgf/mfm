[package]
name = "mfm-portfolio-model"
version = "0.1.0"
edition = "2021"
description = "Canonical portfolio, symbol, and wallet model for MFM portfolio snapshots"
repository = "https://github.com/willyrgf/mfm"
license = "MIT"

[package.metadata.mfm]
category = "domain-model"

[dependencies]
bech32 = { workspace = true }
bs58 = { workspace = true, features = ["check"] }
serde = { workspace = true }
serde_json = { workspace = true }

mfm-evm-core = { path = "../../evm-core", version = "0.1.0" }
mfm-canonical = { path = "../../kernel/canonical" }
mfm-ids = { path = "../../kernel/ids" }
mfm-program = { path = "../../kernel/program" }
mfm-program-derive = { path = "../../kernel/program-derive" }
mfm-values = { path = "../../kernel/values" }
