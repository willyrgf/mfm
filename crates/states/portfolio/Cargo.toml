[package]
name = "mfm-state-portfolio"
version = "0.1.0"
edition = "2021"
description = "Reusable portfolio-domain runtime states and adapters for canonical MFM portfolio snapshots"
repository = "https://github.com/willyrgf/mfm"
license = "MIT"

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
alloy-primitives = { workspace = true }

mfm-evm-core = { path = "../../evm-core", version = "0.1.0" }
mfm-evm-runtime = { path = "../../evm-runtime", version = "0.1.0" }
mfm-collectors-rpc-control = { path = "../../collectors/rpc-control", version = "0.1.0" }
mfm-machine = { path = "../../machine", version = "0.1.0" }
mfm-portfolio-model = { path = "../../portfolio/model", version = "0.1.0" }
mfm-portfolio-plan = { path = "../../portfolio/plan", version = "0.1.0" }
mfm-state-common = { path = "../common", version = "0.1.0" }

[dev-dependencies]
tokio = { workspace = true }
