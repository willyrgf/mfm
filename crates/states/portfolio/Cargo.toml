[package]
name = "mfm-state-portfolio"
version = "0.1.0"
edition = "2021"
description = "Reusable portfolio-domain schema and validation for canonical MFM portfolio snapshots"
repository = "https://github.com/willyrgf/mfm"
license = "MIT"

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
num-bigint = "0.4"
