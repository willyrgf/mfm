[package]
name = "mfm-state-keystore"
version = "0.1.0"
edition = "2021"
description = "Reusable keystore administration and transaction states for MFM"
repository = "https://github.com/willyrgf/mfm2"
license = "MIT"

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
alloy-primitives = { workspace = true, features = ["k256"] }
k256 = { version = "0.13", features = ["ecdsa"] }
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
url = { workspace = true }
regex = "1.0"
zeroize = "1.7.0"
rpassword = "7.0"

mfm-machine = { path = "../../machine" }
mfm-sdk = { path = "../../sdk" }
mfm-op-keystore = { package = "mfm-op-keystore-shim", path = "../../ops/keystore-op" }
mfm-state-common = { path = "../common" }
mfm-evm-core = { path = "../../evm-core" }
mfm-evm-runtime = { path = "../../evm-runtime" }
mfm_core = { path = "../../core" }
