[package]
name = "mfm-state-keystore"
version = "0.1.0"
edition = "2021"
description = "Reusable keystore administration and local signing states for MFM"
repository = "https://github.com/willyrgf/mfm"
license = "MIT"
readme = "README.md"

[dependencies]
async-trait = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }

mfm-machine = { path = "../../machine", version = "0.1.0" }
mfm-sdk = { path = "../../sdk", version = "0.1.0" }
mfm-state-common = { path = "../common", version = "0.1.0" }
mfm-collectors-local-keystore = { path = "../../collectors/local-keystore", version = "0.1.0" }
mfm-evm-core = { path = "../../evm-core", version = "0.1.0" }
