[package]
name = "mfm-state-evm-dcv"
version = "0.1.0"
edition = "2021"
description = "Reusable typed EVM deploy/configure/validate state contracts"
repository = "https://github.com/willyrgf/mfm"
license = "MIT"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

mfm-canonical = { path = "../../kernel/canonical", version = "0.1.0" }
mfm-capabilities = { path = "../../kernel/capabilities", version = "0.1.0" }
mfm-effects = { path = "../../kernel/effects", version = "0.1.0" }
mfm-evm-dcv-model = { path = "../../evm-dcv-model", version = "0.1.0" }
mfm-evm-deploy-configure-validate-config = { path = "../../evm-deploy-configure-validate-config", version = "0.1.0" }
mfm-ids = { path = "../../kernel/ids", version = "0.1.0" }
mfm-program = { path = "../../kernel/program", version = "0.1.0" }
mfm-program-derive = { path = "../../kernel/program-derive", version = "0.1.0" }
mfm-values = { path = "../../kernel/values", version = "0.1.0" }

[dev-dependencies]
tokio = { workspace = true }
trybuild = "1.0"
