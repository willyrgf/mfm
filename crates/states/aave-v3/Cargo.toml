[package]
name = "mfm-state-aave-v3"
version = "0.1.0"
edition = "2021"
description = "Reusable Aave V3 deploy and configure states for MFM"
repository = "https://github.com/willyrgf/mfm"
license = "MIT"
readme = "README.md"

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
alloy-primitives = { workspace = true }
hex = { workspace = true }

mfm-machine = { path = "../../machine", version = "0.1.0" }
mfm-collectors-evm = { path = "../../collectors/evm", version = "0.1.0" }
mfm-state-common = { path = "../common", version = "0.1.0" }
mfm-state-portfolio = { path = "../portfolio", version = "0.1.0" }
mfm-state-symbol = { path = "../symbol", version = "0.1.0" }
mfm-state-wallet = { path = "../wallet", version = "0.1.0" }
mfm-evm-core = { path = "../../evm-core", version = "0.1.0" }
mfm-evm-runtime = { path = "../../evm-runtime", version = "0.1.0" }

[dev-dependencies]
tokio = { workspace = true }
