[package]
name = "mfm-catalog-model"
version = "0.1.0"
edition = "2021"
description = "Typed identities for the MFM configuration catalog"
repository = "https://github.com/willyrgf/mfm"
license = "MIT"
readme = "README.md"

[package.metadata.mfm]
category = "domain-model"

[lib]
name = "mfm_catalog_model"
path = "src/lib.rs"

[dependencies]
mfm-ids = { path = "../kernel/ids" }
mfm-values = { path = "../kernel/values" }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
mfm-canonical = { path = "../kernel/canonical" }
serde_json = { workspace = true }
