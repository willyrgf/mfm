[package]
name = "mfm-bitcoin-live"
version = "0.1.0"
edition = "2021"
description = "Reusable Bitcoin transport and runtime binding for MFM"
repository = "https://github.com/willyrgf/mfm"
license = "MIT"

[package.metadata.mfm]
layer = "live"
domain = "bitcoin"

[features]
parity-tests = []

[dependencies]
bitcoin = { workspace = true }
hex = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
thiserror = { workspace = true }
zeroize = "1.7"

mfm-bitcoin = { path = "../../domains/bitcoin" }
mfm-capabilities = { path = "../../kernel/capabilities" }
mfm-events = { path = "../../kernel/events" }
mfm-ids = { path = "../../kernel/ids" }
mfm-replay = { path = "../../kernel/replay" }
mfm-runtime = { path = "../../kernel/runtime" }
mfm-store = { path = "../../kernel/store" }

[dev-dependencies]
static_assertions = "1"
tokio = { workspace = true }

[[test]]
name = "parity_bitcoin_core"
path = "tests/parity_bitcoin_core.rs"
required-features = ["parity-tests"]
