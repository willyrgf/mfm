[package]
name = "mfm-evm-live"
version = "0.1.0"
edition = "2021"
description = "Reusable EVM transport and runtime binding for MFM"
repository = "https://github.com/willyrgf/mfm"
license = "MIT"

[package.metadata.mfm]
layer = "live"
domain = "evm"

[dependencies]
alloy-primitives = { workspace = true, features = ["serde"] }
hex = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }
zeroize = "1.7"

mfm-capabilities = { path = "../../kernel/capabilities" }
mfm-canonical = { path = "../../kernel/canonical" }
mfm-evm = { path = "../../domains/evm" }
mfm-ids = { path = "../../kernel/ids" }
mfm-journal = { path = "../../kernel/journal" }
mfm-program = { path = "../../kernel/program" }
mfm-runtime = { path = "../../kernel/runtime" }
mfm-signing = { path = "../../signing" }
mfm-spec = { path = "../../kernel/spec" }
mfm-store = { path = "../../kernel/store" }
mfm-values = { path = "../../kernel/values" }

[dev-dependencies]
mfm-store = { path = "../../kernel/store", features = ["test-support"] }
static_assertions = "1"
tokio = { workspace = true, features = ["test-util"] }
