[package]
name = "mfm-evm-live"
version = "0.1.0"
edition = "2021"
description = "Qualified bounded EVM provider adapters for MFM"
repository = "https://github.com/willyrgf/mfm"
license = "MIT"

[package.metadata.mfm]
layer = "adapter"
domain = "evm"
domain-role = "live"

[dependencies]
mfm-program = { path = "../../kernel/program" }
mfm-program-derive = { path = "../../kernel/program-derive" }
mfm-canonical = { path = "../../kernel/canonical" }
mfm-chain = { path = "../../domains/chain" }
mfm-portfolio = { path = "../../domains/portfolio" }
mfm-values = { path = "../../kernel/values" }
mfm-capabilities = { path = "../../kernel/capabilities" }
mfm-evm = { path = "../../domains/evm" }
mfm-ids = { path = "../../kernel/ids" }
mfm-signing = { path = "../../signing" }
alloy-consensus = { workspace = true }
alloy-eips = { workspace = true }
alloy-primitives = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
url = { workspace = true }

[dev-dependencies]
mfm-runtime = { path = "../../kernel/runtime" }
tokio = { workspace = true, features = ["test-util"] }
mfm-app = { path = "../../app" }
sqlx = { workspace = true }
getrandom = { workspace = true }
k256 = { workspace = true }
mfm-journal = { path = "../../kernel/journal" }
mfm-keystore = { path = "../../keystore" }
mfm-store = { path = "../../kernel/store" }
mfm-storage-postgres = { path = "../../storages/postgres" }
zeroize = { workspace = true }
