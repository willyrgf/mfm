[package]
name = "mfm-evm-live"
version = "0.1.0"
edition = "2021"
description = "Qualified bounded EVM provider adapters for MFM"
repository = "https://github.com/willyrgf/mfm"
license = "MIT"

[package.metadata.mfm]
layer = "adapter"
domain = "evm"
domain-role = "live"

[dependencies]
mfm-canonical = { path = "../../kernel/canonical" }
mfm-evm = { path = "../../domains/evm" }
mfm-evm-transaction-authority = { path = "../../domains/evm-transaction-authority" }
mfm-ids = { path = "../../kernel/ids" }
mfm-runtime = { path = "../../kernel/runtime" }
mfm-signing = { path = "../../signing" }
mfm-values = { path = "../../kernel/values" }
alloy-primitives = { workspace = true }
alloy-rlp = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }

[dev-dependencies]
mfm-keystore = { path = "../../keystore" }
mfm-program = { path = "../../kernel/program" }
mfm-program-derive = { path = "../../kernel/program-derive" }
mfm-store = { path = "../../kernel/store" }
tokio = { workspace = true }
