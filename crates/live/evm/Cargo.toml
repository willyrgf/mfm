[package]
name = "mfm-evm-live"
version = "0.1.0"
edition = "2021"
description = "Qualified bounded EVM provider adapters for MFM"
repository = "https://github.com/willyrgf/mfm"
license = "MIT"

[package.metadata.mfm]
layer = "adapter"
domain = "evm"
domain-role = "live"

[dependencies]
mfm-evm = { path = "../../domains/evm" }
mfm-ids = { path = "../../kernel/ids" }
mfm-runtime = { path = "../../kernel/runtime" }
mfm-transport-security = { path = "../../transport-security" }
alloy-primitives = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }

[dev-dependencies]
mfm-canonical = { path = "../../kernel/canonical" }
tokio = { workspace = true }
