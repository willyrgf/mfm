[package]
name = "mfm-portfolio-live"
version = "0.1.0"
edition = "2021"
description = "Portfolio live selection and hydration bindings for MFM"
repository = "https://github.com/willyrgf/mfm"
license = "MIT"

[package.metadata.mfm]
layer = "live"
domain = "portfolio"

[dependencies]
mfm-events = { path = "../../kernel/events" }
mfm-facts = { path = "../../kernel/facts" }
mfm-portfolio = { path = "../../domains/portfolio" }
mfm-runtime = { path = "../../kernel/runtime" }
mfm-store = { path = "../../kernel/store" }

[dev-dependencies]
mfm-ids = { path = "../../kernel/ids" }
