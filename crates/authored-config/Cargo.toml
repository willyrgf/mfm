[package]
name = "mfm-authored-config"
version = "0.1.0"
edition = "2021"
description = "Shared JSON/TOML authored-config ingress helpers"
repository = "https://github.com/willyrgf/mfm"
license = "MIT"

[package.metadata.mfm]
category = "domain-config"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"
thiserror = { workspace = true }

mfm-canonical = { path = "../kernel/canonical" }
mfm-ids = { path = "../kernel/ids" }
