[package]
name = "mfm-storage-postgres"
version = "0.1.0"
edition = "2021"
autotests = false
description = "Durable PostgreSQL frame adapter for MFM"
repository = "https://github.com/willyrgf/mfm"
license = "MIT"

[package.metadata.mfm]
layer = "storage"
binary-facing = false

[lib]
name = "mfm_storage_postgres"
path = "src/lib.rs"

[features]
parity-tests = ["mfm-store/backend-conformance"]
test-support = ["mfm-store/backend-conformance"]

[dependencies]
mfm-canonical = { path = "../../kernel/canonical" }
mfm-ids = { path = "../../kernel/ids" }
mfm-journal = { path = "../../kernel/journal" }
mfm-store = { path = "../../kernel/store" }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
