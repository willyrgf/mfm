[package]
name = "mfm-storage-postgres"
version = "0.1.0"
edition = "2021"
autotests = false
description = "Durable PostgreSQL frame adapter for MFM"
repository = "https://github.com/willyrgf/mfm"
license = "MIT"

[package.metadata.mfm]
layer = "storage"
binary-facing = false

[lib]
name = "mfm_storage_postgres"
path = "src/lib.rs"

[dependencies]
mfm-canonical = { path = "../../kernel/canonical" }
mfm-config = { path = "../../config" }
mfm-evm = { path = "../../domains/evm" }
mfm-evm-transaction-authority = { path = "../../domains/evm-transaction-authority" }
mfm-ids = { path = "../../kernel/ids" }
mfm-journal = { path = "../../kernel/journal" }
mfm-store = { path = "../../kernel/store" }
mfm-values = { path = "../../kernel/values" }
getrandom = { workspace = true }
percent-encoding = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
url = { workspace = true }

[dev-dependencies]
static_assertions = "1.1"
tokio = { workspace = true }
