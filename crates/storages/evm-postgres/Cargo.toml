[package]
name = "mfm-storage-evm-postgres"
version = "0.1.0"
edition = "2021"
autotests = false
autobins = false
description = "EVM wallet nonce authority for MFM adapters"
repository = "https://github.com/willyrgf/mfm"
license = "MIT"

[package.metadata.mfm]
layer = "storage"
domain = "evm"

[lib]
name = "mfm_storage_evm_postgres"
path = "src/lib.rs"

[features]
parity-tests = []

[dependencies]
mfm-ids = { path = "../../kernel/ids" }
sqlx = { workspace = true }
thiserror = { workspace = true }
