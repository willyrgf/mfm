[package]
name = "mfm-stream-store-postgres"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[package.metadata.mfm]
category = "storage"

[dependencies]
mfm-events = { path = "../../kernel/events" }
mfm-ids = { path = "../../kernel/ids" }
mfm-spec = { path = "../../kernel/spec" }
mfm-store = { path = "../../kernel/store" }
serde_json = { workspace = true }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-none", "postgres", "macros", "migrate", "json"] }
tokio = { workspace = true }

[features]
parity-tests = []
