[package]
name = "mfm-stream-store-postgres"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[package.metadata.mfm]
category = "storage"

[dependencies]
ed25519-dalek = { workspace = true }
mfm-artifact-capabilities = { path = "../../artifact-capabilities" }
mfm-canonical = { path = "../../kernel/canonical" }
mfm-events = { path = "../../kernel/events" }
mfm-facts = { path = "../../kernel/facts" }
mfm-ids = { path = "../../kernel/ids" }
mfm-spec = { path = "../../kernel/spec" }
mfm-store = { path = "../../kernel/store" }
serde_json = { workspace = true }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-none", "postgres", "macros", "migrate", "json"] }
tokio = { workspace = true }
thiserror = { workspace = true }
zeroize = "1.7"

[dev-dependencies]
k256 = { version = "0.13.0", features = ["ecdsa"] }
mfm-capabilities = { path = "../../kernel/capabilities" }
mfm-certify = { path = "../../kernel/certify" }
mfm-manual-auth = { path = "../../kernel/manual-auth" }
mfm-store = { path = "../../kernel/store", features = ["test-support"] }

[features]
parity-tests = []
