[package]
name = "mfm-stream-store-postgres"
version = "0.1.0"
edition = "2021"

[package.metadata.mfm]
category = "storage"

[dependencies]
mfm-events = { path = "../../kernel/events" }
mfm-ids = { path = "../../kernel/ids" }
mfm-spec = { path = "../../kernel/spec" }
mfm-store = { path = "../../kernel/store" }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-postgres = { version = "0.7.13", features = ["with-serde_json-1", "with-uuid-1"] }

[features]
parity-tests = []
