[package]
name = "mfm-keystore"
version = "0.1.0"
edition = "2021"
description = "Thread-affine bounded secret custody for MFM"
repository = "https://github.com/willyrgf/mfm"
license = "MIT"

[package.metadata.mfm]
layer = "secret-provider"

[lib]
name = "mfm_keystore"
path = "src/lib.rs"

[dependencies]
k256 = { workspace = true }
mfm-ids = { path = "../kernel/ids" }
mfm-signing = { path = "../signing" }
thiserror = { workspace = true }
tokio = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
serde = { workspace = true }
trybuild = "1.0"
