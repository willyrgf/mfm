[package]
name = "mfm-keystore"
version = "0.1.0"
edition = "2021"
description = "Thread-affine bounded secret custody for MFM"
repository = "https://github.com/willyrgf/mfm"
license = "MIT"

[package.metadata.mfm]
layer = "secret-provider"

[lib]
name = "mfm_keystore"
path = "src/lib.rs"

[dependencies]
mfm-ids = { path = "../kernel/ids" }
thiserror = { workspace = true }
zeroize = "1.7"

[dev-dependencies]
trybuild = "1.0"
