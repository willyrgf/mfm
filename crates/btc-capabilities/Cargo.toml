[package]
name = "mfm-btc-capabilities"
version = "0.1.0"
edition = "2021"
description = "Reusable Bitcoin capability contracts for MFM"
repository = "https://github.com/willyrgf/mfm"
license = "MIT"

[package.metadata.mfm]
layer = "domain"
domain = "bitcoin"
domain-role = "source"

[dependencies]
thiserror = { workspace = true }

mfm-canonical = { path = "../kernel/canonical" }
mfm-capabilities = { path = "../kernel/capabilities" }
mfm-ids = { path = "../kernel/ids" }
