[package]
name = "mfm-collectors-btc-jsonrpc-http"
version = "0.1.0"
edition = "2021"
description = "Bitcoin Core JSON-RPC over HTTP client for managed Bitcoin IO"
repository = "https://github.com/willyrgf/mfm"
license = "MIT"

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
