[package]
name = "mfm-evm"
version = "0.1.0"
edition = "2021"
description = "Pure EVM audited-read graph, protocol, and signing contracts for MFM"
repository = "https://github.com/willyrgf/mfm"
license = "MIT"

[package.metadata.mfm]
layer = "domain"
domain = "evm"
domain-role = "source"

[dependencies]
alloy-consensus = { workspace = true }
alloy-eips = { workspace = true }
alloy-primitives = { workspace = true, features = ["k256", "serde"] }
derive_more = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

mfm-canonical = { path = "../../kernel/canonical" }
mfm-facts = { path = "../../kernel/facts" }
mfm-ids = { path = "../../kernel/ids" }
mfm-journal = { path = "../../kernel/journal" }
mfm-program = { path = "../../kernel/program" }
mfm-program-derive = { path = "../../kernel/program-derive" }
mfm-signing = { path = "../../signing" }
mfm-spec = { path = "../../kernel/spec" }
mfm-values = { path = "../../kernel/values" }

[dev-dependencies]
tokio = { workspace = true }
trybuild = "1.0"
