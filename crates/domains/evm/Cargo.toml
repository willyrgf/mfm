[package]
name = "mfm-evm"
version = "0.1.0"
edition = "2021"
autotests = false
description = "Secret-free EVM cumulative contexts and capability contracts for MFM"
repository = "https://github.com/willyrgf/mfm"
license = "MIT"

[package.metadata.mfm]
layer = "domain"
domain = "evm"
domain-role = "source"

[[test]]
name = "balance_matrix"
path = "tests/balance_matrix.rs"

[features]
test-support = []

[dependencies]
mfm-capabilities = { path = "../../kernel/capabilities" }
mfm-facts = { path = "../../kernel/facts" }
mfm-ids = { path = "../../kernel/ids" }
mfm-program = { path = "../../kernel/program" }
mfm-program-derive = { path = "../../kernel/program-derive" }
mfm-values = { path = "../../kernel/values" }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
mfm-canonical = { path = "../../kernel/canonical" }
serde_json = { workspace = true }
