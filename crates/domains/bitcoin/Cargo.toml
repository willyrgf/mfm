[package]
name = "mfm-bitcoin"
version = "0.1.0"
edition = "2021"
description = "Runtime-independent Bitcoin read qualification models for MFM"
repository = "https://github.com/willyrgf/mfm"
license = "MIT"

[package.metadata.mfm]
layer = "domain"
domain = "bitcoin"
domain-role = "source"

[dependencies]
bitcoin = { workspace = true }
thiserror = { workspace = true }

mfm-ids = { path = "../../kernel/ids" }
