[package]
name = "mfm-portfolio"
version = "0.1.0"
edition = "2021"
autotests = false
description = "Secret-free sequential Portfolio contexts for MFM"
repository = "https://github.com/willyrgf/mfm"
license = "MIT"

[package.metadata.mfm]
layer = "domain"
domain = "portfolio"
domain-role = "aggregate"

[dependencies]
mfm-evm = { path = "../evm" }
mfm-ids = { path = "../../kernel/ids" }
mfm-program = { path = "../../kernel/program" }
mfm-program-derive = { path = "../../kernel/program-derive" }
mfm-values = { path = "../../kernel/values" }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
mfm-canonical = { path = "../../kernel/canonical" }
serde_json = { workspace = true }

[[test]]
name = "planning_contract"
path = "tests/planning_contract.rs"
