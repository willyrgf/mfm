[package]
name = "mfm-portfolio"
version = "0.1.0"
edition = "2021"
description = "Pure portfolio model, state, and operation contracts for MFM"
repository = "https://github.com/willyrgf/mfm"
license = "MIT"

[package.metadata.mfm]
layer = "domain"
domain = "portfolio"
domain-role = "aggregate"

[dependencies]
alloy-primitives = { workspace = true }
num-bigint = "0.4"
num-traits = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

mfm-bitcoin = { path = "../bitcoin" }
mfm-canonical = { path = "../../kernel/canonical" }
mfm-evm = { path = "../evm" }
mfm-ids = { path = "../../kernel/ids" }
mfm-journal = { path = "../../kernel/journal" }
mfm-program = { path = "../../kernel/program" }
mfm-program-derive = { path = "../../kernel/program-derive" }
mfm-spec = { path = "../../kernel/spec" }
mfm-values = { path = "../../kernel/values" }
