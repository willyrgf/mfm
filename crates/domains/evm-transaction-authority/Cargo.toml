[package]
name = "mfm-evm-transaction-authority"
version = "0.1.0"
edition = "2021"
description = "Append-only nonce and transaction authority contract for MFM EVM Effects"
repository = "https://github.com/willyrgf/mfm"
license = "MIT"

[package.metadata.mfm]
layer = "domain-port"
binary-facing = false

[lib]
name = "mfm_evm_transaction_authority"
path = "src/lib.rs"

[dependencies]
mfm-evm = { path = "../evm" }
mfm-ids = { path = "../../kernel/ids" }
thiserror = { workspace = true }

[dev-dependencies]
mfm-canonical = { path = "../../kernel/canonical" }
