[package]
name = "mfm-canonical"
version = "0.1.0"
edition = "2021"
description = "Canonicalization contracts for the MFM typed kernel"
repository = "https://github.com/willyrgf/mfm"
license = "MIT"
readme = "README.md"

[package.metadata.mfm]
layer = "kernel"
domain-facing = true
binary-facing = true

[lib]
name = "mfm_canonical"
path = "src/lib.rs"

[dependencies]
mfm-ids = { path = "../ids" }
ring = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
