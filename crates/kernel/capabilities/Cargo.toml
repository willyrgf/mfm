[package]
name = "mfm-capabilities"
version = "0.1.0"
edition = "2021"
description = "Effect and capability contracts for the MFM typed kernel"
repository = "https://github.com/willyrgf/mfm"
license = "MIT"
readme = "README.md"

[package.metadata.mfm]
layer = "kernel"
domain-facing = true
binary-facing = false

[lib]
name = "mfm_capabilities"
path = "src/lib.rs"

[dependencies]
thiserror = { workspace = true }
mfm-canonical = { path = "../canonical" }
mfm-facts = { path = "../facts" }
mfm-ids = { path = "../ids" }
mfm-values = { path = "../values" }

[dev-dependencies]
mfm-program-derive = { path = "../program-derive" }
serde = { workspace = true }
trybuild = "1.0"
