[package]
name = "mfm-capabilities"
version = "0.1.0"
edition = "2021"
description = "Capability contracts for the MFM typed kernel"
repository = "https://github.com/willyrgf/mfm"
license = "MIT"
readme = "README.md"

[package.metadata.mfm]
category = "kernel"

[lib]
name = "mfm_capabilities"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
mfm-effects = { path = "../effects" }
mfm-ids = { path = "../ids" }

[dev-dependencies]
trybuild = "1.0"
