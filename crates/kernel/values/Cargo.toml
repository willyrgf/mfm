[package]
name = "mfm-values"
version = "0.1.0"
edition = "2021"
description = "Typed value and descriptor contracts for the MFM typed kernel"
repository = "https://github.com/willyrgf/mfm"
license = "MIT"
readme = "README.md"

[package.metadata.mfm]
layer = "kernel"
domain-facing = true
binary-facing = false

[lib]
name = "mfm_values"
path = "src/lib.rs"

[dependencies]
mfm-canonical = { path = "../canonical" }
mfm-ids = { path = "../ids" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
