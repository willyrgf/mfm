[package]
name = "mfm-facts"
version = "0.1.0"
edition = "2021"
description = "Fact descriptor and query evidence contracts for the MFM typed kernel"
repository = "https://github.com/willyrgf/mfm"
license = "MIT"
readme = "README.md"

[package.metadata.mfm]
category = "kernel"

[lib]
name = "mfm_facts"
path = "src/lib.rs"

[dependencies]
mfm-canonical = { path = "../canonical" }
mfm-ids = { path = "../ids" }
mfm-values = { path = "../values" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
