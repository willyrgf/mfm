[package]
name = "mfm-facts"
version = "0.1.0"
edition = "2021"
description = "Pure fact authoring and selection semantics for the MFM typed kernel"
repository = "https://github.com/willyrgf/mfm"
license = "MIT"
readme = "README.md"

[package.metadata.mfm]
layer = "kernel"
domain-facing = true
binary-facing = false

[lib]
name = "mfm_facts"
path = "src/lib.rs"

[dependencies]
mfm-canonical = { path = "../canonical" }
mfm-ids = { path = "../ids" }
mfm-program-derive = { path = "../program-derive" }
mfm-values = { path = "../values" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
