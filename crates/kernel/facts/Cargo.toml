[package]
name = "mfm-facts"
version = "0.1.0"
edition = "2021"
autotests = false
description = "Strict prior-fact request and publication values for MFM"
repository = "https://github.com/willyrgf/mfm"
license = "MIT"
readme = "README.md"

[package.metadata.mfm]
layer = "kernel"
domain-facing = false
binary-facing = false

[lib]
name = "mfm_facts"
path = "src/lib.rs"

[dependencies]
mfm-canonical = { path = "../canonical" }
mfm-ids = { path = "../ids" }
mfm-program-derive = { path = "../program-derive" }
mfm-values = { path = "../values" }
serde = { workspace = true }
thiserror = { workspace = true }
