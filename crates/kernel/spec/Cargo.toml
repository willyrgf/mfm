[package]
name = "mfm-spec"
version = "0.1.0"
edition = "2021"
description = "Certified typed execution spec contracts for MFM"
repository = "https://github.com/willyrgf/mfm"
license = "MIT"
readme = "README.md"

[package.metadata.mfm]
category = "kernel"

[lib]
name = "mfm_spec"
path = "src/lib.rs"

[dependencies]
mfm-capabilities = { path = "../capabilities" }
mfm-canonical = { path = "../canonical" }
mfm-ids = { path = "../ids" }
serde_json = { workspace = true }
