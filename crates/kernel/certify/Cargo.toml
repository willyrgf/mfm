[package]
name = "mfm-certify"
version = "0.1.0"
edition = "2021"
autotests = false
description = "Certification contracts for MFM typed execution specs"
repository = "https://github.com/willyrgf/mfm"
license = "MIT"
readme = "README.md"

[package.metadata.mfm]
layer = "kernel"
domain-facing = true
binary-facing = false

[lib]
name = "mfm_certify"
path = "src/lib.rs"

[features]
# Internal bridge used only by the runtime/store cutover.  Keeping the live
# process handoff out of the default certification API prevents a consumer of
# this crate from manufacturing the runtime assembly halves.
runtime-authority = []

[dependencies]
mfm-authority-seal = { path = "../authority-seal" }
futures-util = "0.3.32"
mfm-canonical = { path = "../canonical" }
mfm-capabilities = { path = "../capabilities" }
mfm-facts = { path = "../facts" }
mfm-ids = { path = "../ids" }
mfm-journal = { path = "../journal" }
mfm-program = { path = "../program" }
mfm-program-derive = { path = "../program-derive" }
mfm-spec = { path = "../spec" }
mfm-values = { path = "../values" }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
thiserror = { workspace = true }

[dev-dependencies]
trybuild = "1.0"

[[test]]
name = "structured-certification"
path = "tests/structured_certification.rs"

[[test]]
name = "structured-ui"
path = "tests/structured_ui.rs"
