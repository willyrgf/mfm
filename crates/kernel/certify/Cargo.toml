[package]
name = "mfm-certify"
version = "0.1.0"
edition = "2021"
description = "Certification contracts for MFM typed execution specs"
repository = "https://github.com/willyrgf/mfm"
license = "MIT"
readme = "README.md"

[package.metadata.mfm]
layer = "kernel"
domain-facing = true
binary-facing = false

[lib]
name = "mfm_certify"
path = "src/lib.rs"

[dependencies]
mfm-canonical = { path = "../canonical" }
mfm-ids = { path = "../ids" }
mfm-journal = { path = "../journal" }
mfm-program = { path = "../program" }
mfm-spec = { path = "../spec" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
