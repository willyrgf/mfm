[package]
name = "mfm-store"
version = "0.1.0"
edition = "2021"
description = "Mechanical append-only Store for MFM"
repository = "https://github.com/willyrgf/mfm"
license = "MIT"
readme = "README.md"

[package.metadata.mfm]
layer = "kernel"
domain-facing = false
binary-facing = false

[lib]
name = "mfm_store"
path = "src/lib.rs"

[dependencies]
mfm-ids = { path = "../ids" }
mfm-journal = { path = "../journal" }
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
mfm-canonical = { path = "../canonical" }
tokio = { workspace = true }
