[package]
name = "mfm-store"
version = "0.1.0"
edition = "2021"
description = "Typed kernel store contracts for MFM"
repository = "https://github.com/willyrgf/mfm"
license = "MIT"
readme = "README.md"

[package.metadata.mfm]
layer = "kernel"
domain-facing = false
binary-facing = false

[lib]
name = "mfm_store"
path = "src/lib.rs"

[features]
test-support = []

[dependencies]
mfm-canonical = { path = "../canonical" }
mfm-capabilities = { path = "../capabilities" }
mfm-certify = { path = "../certify" }
mfm-events = { path = "../events" }
mfm-facts = { path = "../facts" }
mfm-ids = { path = "../ids" }
mfm-manual-auth = { path = "../manual-auth" }
mfm-spec = { path = "../spec" }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
k256 = { version = "0.13.0", features = ["ecdsa"] }
mfm-events = { path = "../events" }
mfm-ids = { path = "../ids" }
mfm-program = { path = "../program" }
mfm-program-derive = { path = "../program-derive" }
mfm-spec = { path = "../spec" }
mfm-values = { path = "../values" }
serde = { workspace = true }
trybuild = "1.0"

[[test]]
name = "commit_contract"
path = "tests/commit_contract.rs"
required-features = ["test-support"]
