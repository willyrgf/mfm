[package]
name = "mfm-store"
version = "0.1.0"
edition = "2021"
autotests = false
description = "Typed kernel store contracts for MFM"
repository = "https://github.com/willyrgf/mfm"
license = "MIT"
readme = "README.md"

[package.metadata.mfm]
layer = "kernel"
domain-facing = false
binary-facing = false

[lib]
name = "mfm_store"
path = "src/lib.rs"

[features]
test-support = []
backend-conformance = ["test-support"]

[dependencies]
mfm-canonical = { path = "../canonical" }
mfm-certify = { path = "../certify" }
mfm-runtime = { path = "../runtime", features = ["store-authority"] }
mfm-facts = { path = "../facts" }
mfm-ids = { path = "../ids" }
mfm-journal = { path = "../journal" }
mfm-spec = { path = "../spec" }
mfm-values = { path = "../values" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
mfm-capabilities = { path = "../capabilities" }
mfm-certify = { path = "../certify" }
mfm-facts = { path = "../facts" }
mfm-ids = { path = "../ids" }
mfm-program = { path = "../program" }
mfm-program-derive = { path = "../program-derive" }
mfm-replay = { path = "../replay" }
mfm-runtime = { path = "../runtime" }
mfm-spec = { path = "../spec" }
mfm-values = { path = "../values" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
trybuild = "1.0"

[[test]]
name = "api-surface"
path = "tests/api_surface.rs"

[[test]]
name = "structured-runtime"
path = "tests/structured_runtime.rs"
required-features = ["test-support"]

[[test]]
name = "structured-runtime-causal"
path = "tests/structured_runtime_causal.rs"
required-features = ["test-support"]
