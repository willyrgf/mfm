[package]
name = "mfm-store"
version = "0.1.0"
edition = "2021"
description = "Typed kernel store contracts for MFM"
repository = "https://github.com/willyrgf/mfm"
license = "MIT"
readme = "README.md"

[package.metadata.mfm]
layer = "kernel"
domain-facing = false
binary-facing = false

[lib]
name = "mfm_store"
path = "src/lib.rs"

[features]
test-support = []

[dependencies]
mfm-canonical = { path = "../canonical" }
mfm-capabilities = { path = "../capabilities" }
mfm-executor = { path = "../executor" }
mfm-facts = { path = "../facts" }
mfm-ids = { path = "../ids" }
mfm-journal = { path = "../journal" }
mfm-spec = { path = "../spec" }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
mfm-ids = { path = "../ids" }
mfm-values = { path = "../values" }
serde = { workspace = true }
tokio = { workspace = true }
trybuild = "1.0"

[[test]]
name = "mfm-store-memory"
path = "tests/memory_conformance.rs"
required-features = ["test-support"]
