[package]
name = "mfm-store"
version = "0.1.0"
edition = "2021"
description = "Typed kernel store contracts for MFM"
repository = "https://github.com/willyrgf/mfm"
license = "MIT"
readme = "README.md"

[lib]
name = "mfm_store"
path = "src/lib.rs"

[dependencies]
mfm-canonical = { path = "../canonical" }
mfm-capabilities = { path = "../capabilities" }
mfm-events = { path = "../events" }
mfm-ids = { path = "../ids" }
mfm-spec = { path = "../spec" }
serde_json = { workspace = true }

[dev-dependencies]
mfm-certify = { path = "../certify" }
mfm-events = { path = "../events" }
mfm-ids = { path = "../ids" }
mfm-spec = { path = "../spec" }
