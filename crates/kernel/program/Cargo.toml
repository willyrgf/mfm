[package]
name = "mfm-program"
version = "0.1.0"
edition = "2021"
description = "Typed Operation authoring and immutable Program v3 contracts for MFM"
repository = "https://github.com/willyrgf/mfm"
license = "MIT"
readme = "README.md"

[package.metadata.mfm]
layer = "kernel"
domain-facing = true
binary-facing = false

[lib]
name = "mfm_program"
path = "src/lib.rs"

[dependencies]
mfm-canonical = { path = "../canonical" }
mfm-capabilities = { path = "../capabilities" }
mfm-ids = { path = "../ids" }
mfm-values = { path = "../values" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
mfm-program-derive = { path = "../program-derive" }
serde = { workspace = true }
serde_json = { workspace = true }
trybuild = "1.0"
