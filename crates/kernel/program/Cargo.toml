[package]
name = "mfm-program"
version = "0.1.0"
edition = "2021"
autotests = false
description = "Typed state-program authoring contracts for MFM"
repository = "https://github.com/willyrgf/mfm"
license = "MIT"
readme = "README.md"

[package.metadata.mfm]
layer = "kernel"
domain-facing = true
binary-facing = false

[lib]
name = "mfm_program"
path = "src/lib.rs"

[dependencies]
mfm-canonical = { path = "../canonical" }
mfm-capabilities = { path = "../capabilities" }
mfm-facts = { path = "../facts" }
mfm-ids = { path = "../ids" }
mfm-spec = { path = "../spec" }
mfm-values = { path = "../values" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
mfm-program-derive = { path = "../program-derive" }
trybuild = "1.0"

[[test]]
name = "structured-authoring"
path = "tests/structured_authoring.rs"

[[test]]
name = "structured-ui"
path = "tests/structured_ui.rs"
