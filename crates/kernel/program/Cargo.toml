[package]
name = "mfm-program"
version = "0.1.0"
edition = "2021"
description = "Typed state-program authoring contracts for MFM"
repository = "https://github.com/willyrgf/mfm"
license = "MIT"
readme = "README.md"

[package.metadata.mfm]
layer = "kernel"
domain-facing = true
binary-facing = false

[lib]
name = "mfm_program"
path = "src/lib.rs"

[dependencies]
mfm-canonical = { path = "../canonical" }
mfm-executor = { path = "../executor" }
mfm-facts = { path = "../facts" }
mfm-ids = { path = "../ids" }
mfm-journal = { path = "../journal" }
mfm-program-derive = { path = "../program-derive" }
mfm-spec = { path = "../spec" }
mfm-store = { path = "../store" }
mfm-values = { path = "../values" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
