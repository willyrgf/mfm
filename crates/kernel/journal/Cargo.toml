[package]
name = "mfm-journal"
version = "0.1.0"
edition = "2021"
description = "Annex-backed recoverability journal contracts for MFM"
repository = "https://github.com/willyrgf/mfm"
license = "MIT"
readme = "README.md"

[package.metadata.mfm]
layer = "kernel"
domain-facing = false
binary-facing = false

[lib]
name = "mfm_journal"
path = "src/lib.rs"

[dependencies]
mfm-canonical = { path = "../canonical" }
mfm-capabilities = { path = "../capabilities" }
mfm-facts = { path = "../facts" }
mfm-ids = { path = "../ids" }
mfm-values = { path = "../values" }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
