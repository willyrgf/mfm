[package]
name = "mfm-events"
version = "0.1.0"
edition = "2021"
description = "Typed kernel event contracts for MFM"
repository = "https://github.com/willyrgf/mfm"
license = "MIT"
readme = "README.md"

[package.metadata.mfm]
category = "kernel"

[lib]
name = "mfm_events"
path = "src/lib.rs"

[dependencies]
mfm-canonical = { path = "../canonical" }
mfm-facts = { path = "../facts" }
mfm-ids = { path = "../ids" }
mfm-spec = { path = "../spec" }
serde_json = { workspace = true }
thiserror = { workspace = true }
