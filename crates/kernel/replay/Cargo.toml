[package]
name = "mfm-replay"
version = "0.1.0"
edition = "2021"
autotests = false
description = "Callback-free retained-prefix replay for MFM"
repository = "https://github.com/willyrgf/mfm"
license = "MIT"
readme = "README.md"

[package.metadata.mfm]
layer = "kernel"
domain-facing = false
binary-facing = false

[lib]
name = "mfm_replay"
path = "src/lib.rs"

[dependencies]
mfm-canonical = { path = "../canonical" }
mfm-journal = { path = "../journal" }
mfm-ids = { path = "../ids" }
mfm-program = { path = "../program" }
mfm-store = { path = "../store" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[features]
test-support = []
