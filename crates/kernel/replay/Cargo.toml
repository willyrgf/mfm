[package]
name = "mfm-replay"
version = "0.1.0"
edition = "2021"
description = "Typed replay brokers and verifier contracts for MFM certified execution specs"
repository = "https://github.com/willyrgf/mfm"
license = "MIT"
readme = "README.md"

[package.metadata.mfm]
layer = "kernel"
domain-facing = false
binary-facing = false

[lib]
name = "mfm_replay"
path = "src/lib.rs"

[dependencies]
mfm-canonical = { path = "../canonical" }
mfm-capabilities = { path = "../capabilities" }
mfm-certify = { path = "../certify" }
mfm-events = { path = "../events" }
mfm-facts = { path = "../facts" }
mfm-ids = { path = "../ids" }
mfm-manual-auth = { path = "../manual-auth" }
mfm-program = { path = "../program" }
mfm-runtime = { path = "../runtime" }
mfm-spec = { path = "../spec" }
mfm-store = { path = "../store" }
mfm-values = { path = "../values" }
serde_json = { version = "1.0" }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
mfm-store = { path = "../store", features = ["test-support"] }
trybuild = "1.0"
