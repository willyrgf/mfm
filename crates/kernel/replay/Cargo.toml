[package]
name = "mfm-replay"
version = "0.1.0"
edition = "2021"
autotests = false
description = "Callback-free history verification, inspection, and portable export for MFM"
repository = "https://github.com/willyrgf/mfm"
license = "MIT"
readme = "README.md"

[package.metadata.mfm]
layer = "kernel"
domain-facing = false
binary-facing = false

[lib]
name = "mfm_replay"
path = "src/lib.rs"

[dependencies]
mfm-authority-seal = { path = "../authority-seal" }
mfm-canonical = { path = "../canonical" }
mfm-ids = { path = "../ids" }
mfm-journal = { path = "../journal" }
mfm-spec = { path = "../spec" }
mfm-store = { path = "../store" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
mfm-store = { path = "../store", features = ["test-support"] }
tokio = { workspace = true }
