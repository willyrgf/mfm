[package]
name = "mfm-program-derive"
version = "0.1.0"
edition = "2021"
description = "Derive macros for MFM typed program contracts"
repository = "https://github.com/willyrgf/mfm"
license = "MIT"
readme = "README.md"

[package.metadata.mfm]
category = "kernel"

[lib]
name = "mfm_program_derive"
path = "src/lib.rs"
proc-macro = true

[dependencies]
mfm-canonical = { path = "../canonical" }
mfm-ids = { path = "../ids" }
mfm-values = { path = "../values" }
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full", "extra-traits"] }

[dev-dependencies]
mfm-program = { path = "../program" }
serde = { workspace = true }
serde_json = { workspace = true }
trybuild = "1.0"
