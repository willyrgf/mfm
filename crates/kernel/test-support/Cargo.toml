[package]
name = "mfm-kernel-test-support"
version = "0.1.0"
edition = "2021"
description = "Test support for MFM typed kernel contracts"
repository = "https://github.com/willyrgf/mfm"
license = "MIT"
readme = "README.md"

[lib]
name = "mfm_kernel_test_support"
path = "src/lib.rs"

[dependencies]
mfm-canonical = { path = "../canonical" }
mfm-capabilities = { path = "../capabilities" }
mfm-certify = { path = "../certify" }
mfm-events = { path = "../events" }
mfm-ids = { path = "../ids" }
mfm-program = { path = "../program" }
mfm-program-derive = { path = "../program-derive" }
mfm-values = { path = "../values" }
mfm-replay = { path = "../replay" }
mfm-runtime = { path = "../runtime" }
mfm-spec = { path = "../spec" }
mfm-store = { path = "../store" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
