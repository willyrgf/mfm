[package]
name = "mfm-runtime"
version = "0.1.0"
edition = "2021"
autotests = false
description = "Immutable live Runtime assembly for MFM"
repository = "https://github.com/willyrgf/mfm"
license = "MIT"
readme = "README.md"

[[test]]
name = "api_contract"
path = "tests/api_contract.rs"

[[test]]
name = "assembly_cutover"
path = "tests/assembly_cutover.rs"

[package.metadata.mfm]
layer = "kernel"
domain-facing = false
binary-facing = false

[lib]
name = "mfm_runtime"
path = "src/lib.rs"

[dependencies]
mfm-canonical = { path = "../canonical" }
mfm-capabilities = { path = "../capabilities" }
mfm-facts = { path = "../facts" }
mfm-ids = { path = "../ids" }
mfm-journal = { path = "../journal" }
mfm-program = { path = "../program" }
mfm-store = { path = "../store" }
mfm-values = { path = "../values" }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
mfm-program-derive = { path = "../program-derive" }
serde = { workspace = true }
trybuild = "1.0"
tokio = { workspace = true }
