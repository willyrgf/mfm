[package]
name = "mfm-runtime"
version = "0.1.0"
edition = "2021"
description = "Stateless audited interpreter for MFM certified execution specs"
repository = "https://github.com/willyrgf/mfm"
license = "MIT"
readme = "README.md"

[package.metadata.mfm]
layer = "kernel"
domain-facing = false
binary-facing = false

[lib]
name = "mfm_runtime"
path = "src/lib.rs"

[dependencies]
mfm-canonical = { path = "../canonical" }
mfm-capabilities = { path = "../capabilities" }
mfm-executor = { path = "../executor" }
mfm-facts = { path = "../facts" }
mfm-ids = { path = "../ids" }
mfm-journal = { path = "../journal" }
mfm-program = { path = "../program" }
mfm-spec = { path = "../spec" }
mfm-store = { path = "../store" }
thiserror = { workspace = true }

[dev-dependencies]
mfm-program-derive = { path = "../program-derive" }
mfm-qualified-run-test-support = { path = "../../../tests/qualified-run-support" }
mfm-store = { path = "../store", features = ["test-support"] }
serde_json = { workspace = true }
tokio = { workspace = true }
