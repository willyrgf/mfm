[package]
name = "mfm-runtime"
version = "0.1.0"
edition = "2021"
description = "Serial typed scheduler for MFM certified execution specs"
repository = "https://github.com/willyrgf/mfm"
license = "MIT"
readme = "README.md"

[package.metadata.mfm]
category = "kernel"

[lib]
name = "mfm_runtime"
path = "src/lib.rs"

[dependencies]
mfm-artifact-capabilities = { path = "../../artifact-capabilities" }
mfm-canonical = { path = "../canonical" }
mfm-capabilities = { path = "../capabilities" }
mfm-certify = { path = "../certify" }
mfm-events = { path = "../events" }
mfm-facts = { path = "../facts" }
mfm-ids = { path = "../ids" }
mfm-manual-auth = { path = "../manual-auth" }
mfm-program = { path = "../program" }
mfm-spec = { path = "../spec" }
mfm-store = { path = "../store" }
mfm-values = { path = "../values" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
ed25519-dalek = { workspace = true }
k256 = { version = "0.13.0", features = ["ecdsa"] }
mfm-effects = { path = "../effects" }
mfm-program-derive = { path = "../program-derive" }
mfm-store = { path = "../store", features = ["test-support"] }
tokio = { workspace = true }
trybuild = "1.0"
