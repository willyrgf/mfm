[package]
name = "mfm-machine"
version = "0.1.0"
edition = "2021"
description = "Runtime contracts and execution-plan types for MFM workflows"
repository = "https://github.com/willyrgf/mfm"
license = "MIT"
readme = "README.md"

[dependencies]
async-trait = { workspace = true }
hex = { workspace = true }
nix = { version = "0.31.1", features = ["fs"] }
rand = { workspace = true }
ring = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { version = "1.8.0", features = ["serde", "v4", "v5"] }
