mfm-machine = { path = "../machine", version = "0.1.0" }
mfm-state-aave-v3 = { path = "../states/aave-v3", version = "0.1.0" }
mfm-state-portfolio = { path = "../states/portfolio", version = "0.1.0" }
mfm-state-symbol = { path = "../states/symbol", version = "0.1.0" }
