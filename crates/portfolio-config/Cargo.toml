[package]
name = "mfm-portfolio-config"
version = "0.1.0"
edition = "2021"
description = "Shared authored and canonical config pipeline for portfolio snapshot workflows"
repository = "https://github.com/willyrgf/mfm"
license = "MIT"

[package.metadata.mfm]
category = "domain-config"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"

mfm-authored-config = { path = "../authored-config", version = "0.1.0" }
mfm-canonical = { path = "../kernel/canonical" }
mfm-ids = { path = "../kernel/ids" }
mfm-program-derive = { path = "../kernel/program-derive" }
mfm-portfolio-model = { path = "../portfolio/model", version = "0.1.0" }
mfm-values = { path = "../kernel/values" }
